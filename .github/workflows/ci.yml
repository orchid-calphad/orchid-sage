name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Tests (standard library only)
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s sage_mcp/tests -t . -v
          python -m unittest discover -s orchid_ids/tests -t . -v
      - name: Scanner (no local information)
        run: python protocols/tools/check_public.py .
      - name: Validator
        run: python protocols/tools/validate.py --quiet
      - name: Validator cross-check with PyYAML and jsonschema
        run: |
          python -m pip install --quiet pyyaml jsonschema
          python protocols/tools/validate.py --quiet --crosscheck "$(command -v python)"
      - name: Stage the Cr-Ni inputs by hash
        run: python protocols/tools/orchid_reproduce.py protocols/specific/crni-paper-fit-step4c-b@1.0.4.yaml --root "$RUNNER_TEMP/stage" --stage-only
