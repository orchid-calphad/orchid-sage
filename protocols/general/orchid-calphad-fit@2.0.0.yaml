decisions:
  - {date: '2026-10-30', who: PI, decision: PhaseForge+ refinements use Brandon Bocklund's Gradient-based_update of Courtney Kunselman's gradient ESPEI; no MCMC or HMC fits, why: the gradient method is the capability ORCHID's CALPHAD vision rests on; MCMC/HMC on Cu-Zr were slow and unconverged, source: memory phaseforge-plus-gradient-only}
  - {date: '2026-10-30', who: PI, decision: pure-element limits from the unary data; ordered end-members equal the disordered parent; mandatory pure-element check, why: Y28 Co-Ga refits made B2 at pure Ga stable, source: memory unary-limits-fixed}
  - {date: '2026-10-30', who: PI, decision: 'full reproducibility: general protocol, specific protocol and run cards; no orphan TDBs', why: no TDB in the field is strictly reproducible, source: ORCHID_COORDINATION.md Y32 (30 Oct 10:45-10:55); memory full-reproducibility, quote: the name of the game is full reproducibility}
  - {date: '2026-10-31', who: PI, decision: rank fits and pick the most reasonable one; no pass/fail gates on fits, why: strict criteria rejected all 15 Co-Ga fits, source: memory rank-models-pick-reasonable, quote: We should just rank models and pick the most reasonable one.}
  - {date: '2026-10-31', who: PI, decision: 'MLIP/DFT error ~9-10 kJ/mol-atom: gates and sigmas never tighter', why: DFT itself is off from calorimetry by that much, source: memory dft-error-vs-experiment}
  - {date: '2026-10-31', who: PI, decision: 'staged relaxation (unrelaxed -> volume -> volume + ions -> full); never relax shape for the value; keep every stage', why: Y36 found collapsed shape-relaxed structures, source: memory mlip-relaxation-protocol}
  - {date: '2026-11-05', who: PI, decision: 'fit from the liquid down (one-shot, liquidus, thermochemistry, solid state, ambiguous structures)', why: this is how expert assessors work; fewer phases at high T, source: memory calphad-fit-sequence-liquidus-first; fit_protocol 0.1, quote: starting from the liquid down is a good strategy overall}
  - {date: '2026-11-05', who: PI, decision: weights come from uncertainties; no hand-set multipliers, why: Cr-Ni Pugliese activities at the ESPEI default bought the wrong topology, source: fit_protocol 0.2}
  - {date: '2026-11-05', who: PI, decision: SGTE references for every end-member including mechanically unstable ones; no inflection detection, why: compatibility with existing databases, source: memory unary-limits-fixed; fit_protocol 0.0a}
  - {date: '2026-11-05', who: PI, decision: data consistency check required before fitting, why: one suspect activity among neighbours of 0.98-0.998, source: fit_protocol 0.2a}
