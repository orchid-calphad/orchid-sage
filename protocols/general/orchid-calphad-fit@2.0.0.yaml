environment:
  - id: fit_env
    kind: venv
    path: <fit-env>
    python: 3.12.14
    packages: {espei: 0.8.11.dev82+g9039ea215, pycalphad: 0.11.3.dev35+g9a6939dd2, numpy: 2.5.4, scipy: 1.18.1, symengine: 0.13.0, xarray: 2026.9.0, matplotlib: 3.11.2, pyyaml: 6.0.3}
    lockfile: {path: <orchid-sage>/protocols/environment/espei-pr268.lock.txt, sha256: e0138471ec8a9b1945b893c6547f212d955310491e534e89ed55e9172bdcafed, storage_class: local}
    hosts: ['mac-studio (Mac Studio, Mac13,1, M1 Max, 10 cores)', 'spark1 (identical build at <home>/orchid-crni-mcmc-20261105/env/grad, read-only)']
    verify_command: <fit-python> -c "import espei; print(espei.__version__, espei.__file__)"
  - id: mlip_container
    kind: container
    image: cuzr-phaseforge-grace-gpu:20261104
    digest:
      status: pending
      reason: "image digest not recorded in any campaign file; read it on spark1 with docker image inspect --format '{{.Id}}' before the next release"
    packages: {tensorflow: '25.02 (NGC)', tensorpotential: 0.6.2.1, materialsframework: 1.0.0, m_scraps: 0.6.0}
    hosts: ['spark1 (DGX Spark, GB10 GPU; spark2 and spark3 approved for CPU MCMC; never spark4)']
  - id: sqs_env
    kind: venv
    path: <home>/.venvs/phaseforge
    packages: {m_scraps: 0.6.0}
    note: SQS generation on the Studio (gen_sqs.py)
  - id: stdlib_tools
    kind: system
    python: '>=3.11 (standard library only)'
    note: protocol tools (validator, crate builder, dashboard builder)

parameters:
  sqs_atoms_bcc_fcc: {default: 128, unit: atoms, allowed: [128, 128], text: SQS cell size for bcc and fcc solutions, source: fit_protocol 0.0a SQS, frozen: true}
  sqs_atoms_hcp_min: {default: 108, unit: atoms, allowed: [108, 1000], text: minimum SQS cell size for hcp (Cu-Zr used 128), source: fit_protocol 0.0a SQS, frozen: true}
  sqs_seeds: {default: 2, text: m_scraps seeds per composition and lattice, source: fit_protocol 0.0a SQS, frozen: true}
  sqs_composition_grid: {default: '1/16, 1/8, 1/4, 3/8, 1/2, 5/8, 3/4, 7/8, 15/16 of the second element, plus both pure elements in the same supercell', text: whole composition range of every lattice, source: fit_protocol 0.0a SQS (PI 5 Nov), frozen: true}
  relaxation_stages: {default: 's0 unrelaxed (ideal parent lattice, Vegard volume) -> s1 volume -> s2 volume + ions (value) -> s3 full (lower bound)', text: staged relaxation; cell shape never relaxed for the value; lattice check after every stage; every stage kept, source: fit_protocol 0.0a Relaxation, frozen: true}
  relaxation_optimizer: {default: 'FIRE + FrechetCellFilter, fmax 0.005 eV/A, at most 3000 steps per stage', text: as in the reference implementation relax_solids.py, source: crni-phaseforge-20261105/code/relax_solids.py}
  value_rule: {default: 's2 if the s2 lattice check passes; otherwise the midpoint of [s3, s0] with sigma = half-width (at least sigma_MLIP)', text: protocol value of each SQS or compound energy, source: fit_protocol 0.0a Cells that transform (PI 6 Nov), frozen: true}
  potential: {default: GRACE-2L-SMAX-OMAT-large, allowed: [GRACE-2L-SMAX-OMAT-large], text: value potential for solids AND liquid; GRACE-2L-OMAT only as cross-check, source: fit_protocol 0.0a Potential (PI 31 Oct; liquid PI 6 Nov), frozen: true}
  references: {default: SGTE for every pure-element end-member (mechanically unstable ones included), text: 'no inflection detection; never fitted', source: fit_protocol 0.0a Reference states; unary-limits-fixed, frozen: true}
  rk_order: {default: 'L0 + L1 (a_k) for the solutions', allowed: ['L0', 'L0 + L1'], text: 'Redlich-Kister terms of the one-shot solution phases; alphabetical element order. Cu-Zr and Cr-Ni both used L0 + L1 (see OPEN_QUESTIONS Q07)', source: fit_protocol 0.0a Fit and TDB}
  liquid_md: {default: '2 ps premelt (3500 K), 5-10 ps NPT, 5 ps NVT, 100 ps NVT production at T just above the highest melting point; 108 atoms, one 864-atom check at x 0.5; pure liquids at the same T', text: liquid MD settings, source: fit_protocol 0.0a Liquid and 9, frozen: true}
  finite_size_acceptance: {default: 5, unit: percent, text: 'accept 108 atoms if 100|S108 - S864|/|S864| < 5 % (vibrational entropy)', source: fit_protocol 9}
  electronic_excess_entropy: {default: 0, unit: J/mol-atom/K, text: 'taken as zero for metallic liquids; stated as an assumption', source: fit_protocol 0.0b (PI 6 Nov); see OPEN_QUESTIONS Q03}
  sigma_mlip: {default: 9687, unit: J/mol-atom, text: 'sigma of every one-shot energy observation: max(sigma_MLIP, s0 - s2, s2 - s3, half seed spread)', source: fit_protocol 0.0a Uncertainty; dft-error-vs-experiment}
  espei_default_sd: {default: {HM: 500, SM: 0.2, ACR: 0.05, ZPF: 1000}, unit: 'J/mol, J/mol/K, -, J/mol', text: ESPEI default standard deviations; weight = default sd / sigma of the observation, source: fit_protocol 0.2}
  hull_tolerance_tau: {default: 100, unit: J/mol-atom, text: 'state tolerance of excluded phases (hull_tolerance_J_per_mol_atom, basis default)', source: fit_protocol item 8}
  observed_absence: {default: {confidence: 1.0, sigma_certain: 10, sigma_otherwise: 'the state own uncertainty converted to energy (sigma_T |dS| or the composition equivalent)', tau: 100}, unit: J/mol-atom, text: 'exclusion at an OBSERVED state (phase stable elsewhere, not in the measured assemblage) - full confidence, never down-weighted; sigma 10 J/mol-atom where the absence is certain (never reported in a well-studied replicated region)', source: 'fit_protocol item 8 (PI 6 Nov - if a phase is not present, that is a very strong signal)'}
  certainty_tiers: {default: {certain: 10, less_certain: 50, uncertain: 100}, unit: J/mol-atom, text: 'PER EXCLUDED PHASE (PI 6 Nov) - 10 when the state is more than 3 of its own T/x uncertainties from any observed field or boundary of that phase and no source reports the phase there; 50 within 3 or single-source; 100 adjacent, diagram-assumed or contested. ZPF records - 100 for boundary/tie-line records, 50 when replicated by independent sources; single-phase field states by their distance to the nearest boundary of their phase. Replaces ESPEI 1000 J/mol', source: 'fit_protocol item 8 (PI 6 Nov 2026)'}
  hinge_sigma_floor: {default: 'sigma = max(certainty tier, converted state uncertainty)', unit: J/mol-atom, text: 'per (state, excluded phase): the hinge scale is the larger of the tier (certainty_tiers) and the state own T and x uncertainty converted to energy as for the per-record ZPF scale sigma_DF - sqrt((sigma_T |dDG/dT|)^2 + (sigma_x |G_e'''' (y - x_e)|)^2), DG the driving force of the excluded phase above the target line, from the previous accepted step; the tier is the floor, not the scale, so a 10 J/mol-atom tier binds only where the state itself is that well defined', source: 'fit_protocol item 8 hinge floor (PI 6 Nov 2026, adopted after the Cr-Ni step-4c test: 0 of 8 starts stationary without it, 8 of 8 with it)'}
  pick_gradient_threshold: {default: 0.001, text: 'a start is eligible for the pick only if its gradient norm in the optimiser scaling is below this threshold, stated in the plan before fitting; near-ties among eligible starts are broken by the objective, never by grid quantities; if none is eligible say so, never loosen it. Kink rule (PI 6 Nov: local kinks are inevitable): a start is also eligible when kink-stationary - every one-sided directional derivative <= 0 (no improvement above 1e-6 log-units) along +- the analytic gradient, +- each parameter and 16 seeded random directions at scaled steps 1e-6, 1e-5, 1e-4; the run card lists the kind (smooth or kink) and the data points on a model boundary, each within its own uncertainty; central FD is never used as a gradient; a failed equilibrium is a failure, rerun from perturbed starts and reported, never a zero driving force', source: 'fit_protocol 10a (PI 6 Nov 2026; kink rule 6b8f443)'}
  polish: {default: {method: 'L-BFGS-B continued from each endpoint, ftol 0, gtol 0, maxcor 20, restarted from the best point', stop: 'verified gradient norm < pick_gradient_threshold, or the evaluation cap, or two restarts improving < 1e-12', max_evals_per_start: 1000, gradient: 'analytic for terms that pass check_gradients; central FD (1e-4 in optimiser coordinates) for the term classes that fail it'}, text: 'polish_starts settings, stated in the plan before fitting and identical on every machine; a start that reaches the cap unconverged stays ineligible', source: 'coordinator decision 6 Nov 2026 (fit_protocol 10a: converge, never loosen)'}
  convexity_T_allow: {default: null, unit: K, text: 'per solution phase: the highest temperature at which concavity may be allowed; the convexity constraint applies only at observed single-phase states above it. Set before fitting from the corrected T_c estimates of 0.4c (SRO and excess vibrational entropy corrections to the incoherent T_c, Cahn coherency correction; MLIP, DFT and fitted excess terms with uncertainties); T_allow is the upper end of that range, recorded with its basis', source: 'fit_protocol 0.4b temperature gate (PI 6 Nov 2026, commit b2d612d)'}
  option_c_exclusions: {default: {sigma: 1000, tau: 100, confidence: 0.5}, text: 'SUPERSEDED for observed states by observed_absence and certainty_tiers (kept for exclusions assumed from a diagram, at the uncertain tier energy)', source: fit_protocol 0.4a (coordinator choice pending PI confirmation; OPEN_QUESTIONS Q05)}
  starts_per_step: {default: 8, allowed: [6, 20], text: 'multistart: start 0 = previous accepted step; starts k >= 1 perturb a-terms a(1 + 0.1 N(0,1)) [+ N(0, 2 kJ) where a = 0] and b-terms b + N(0, 3 J/mol/K), numpy default_rng(1000 + k)', source: 'campaign practice 5-6 Nov (Cu-Zr fit_step.py, Cr-Ni fit.py); OPEN_QUESTIONS Q19'}
  optimizer: {default: 'L-BFGS-B in scaled coordinates with the analytic ESPEI-grad gradient', text: 'Cr-Ni: q = theta/scale (a/1000, b/1), jitter retry then value-only + central FD fallback, every event logged. Cu-Zr: scale 3 J/K (b) and max(0.05|x0|, 1) (a), up to 6 L-BFGS-B restarts of maxiter 300', source: campaign practice; fit_protocol 12.A}
  wall_budget_per_start: {default: 5400, unit: s, allowed: [1800, 43200], text: per-start wall budget; the best point is kept and the budget hit is reported, source: campaign practice}
  plausibility_compound_band: {default: 10, unit: kJ/mol-atom, text: compounds and solid one-shot values within this band of the one-shot (DFT/MLIP error), source: fit_protocol 0.3 item 1; dft-error-vs-experiment}
  plausibility_liquid_sex: {default: 3, unit: u, text: liquid S_ex within 3 of its own uncertainty, source: campaign PLANs (stated before ranking)}
  invariant_window: {default: 25, unit: K, text: quantitative check of invariant temperatures, source: fit_protocol 0.3 item 3}
  mcmc_stop_hours: {default: 12, unit: h, text: 'above this projected wall time stop for a decision', source: fit_protocol 0.6}
  laplace_draws: {default: 1000, text: classified draws from the Laplace mixture, source: 'Cr-Ni PLAN (cheap UQ, no MCMC)'}
  laplace_hessian_steps: {default: [0.001, 0.003], text: 'relative central-difference steps of the analytic gradient, times max(1, |q|), symmetrised; soft-direction repair along the 3 softest eigenvectors', source: cr-ni-rebuild laplace/scripts/hessian_mode.py}

sections:
  - id: s0_preflight
    name: Preflight, established practice and the plan
    rationale: fit_protocol 0.0b, 0.5, 0.6, 1, 2, 11
    steps:
      - id: read_established_practice
        name: Check established practice before writing the brief
        kind: judgement
        text: >-
          Read fit_protocol.md Section 0.0b (the established-practice table), Section 0.0a, and the REPORT.md and PLAN.md
          of the last campaign that did the same step. Write in the plan which rows of 0.0b apply and quote what was done
          before for every item that the new brief touches. A new instruction refines established practice; it replaces it
          only when the PI says so.
        supply: [input:orchid_evidence]
        tool: {name: reading, note: no software}
        result:
          - {id: practice_note, name: established-practice paragraph of PLAN.md, checks: [every 0.0b row named, conflicts quoted]}
        decision_rule: if the brief and 0.0b seem to conflict, stop and ask the PI, quoting what was done before; never reinterpret 0.0a from a short instruction
        decided_by: PI (coordinator raises the question)
        rationale: fit_protocol 0.0b
      - id: write_plan
        name: Write the run specification (PLAN.md) before any launch
        kind: deterministic
        text: >-
          Write PLAN.md in the campaign directory before launching anything: system, T-x domain, phases and models
          (disordered unless evidence requires ordering; ask the PI before adding phases or sublattices), parameters and
          their VV symbols, inputs with paths and sha256, data groups per step, free symbols per step, ranking thresholds
          (stated now, before ranking), compute hosts and a wall-time estimate per block. If any block projects beyond
          12 h, stop for a decision.
        supply: [read_established_practice.practice_note, param:mcmc_stop_hours]
        tool: {name: editor, command: 'cp protocols/templates/PLAN.template.md <campaign>/PLAN.md && $EDITOR <campaign>/PLAN.md   # then: python3 protocols/tools/check_plan.py <campaign>/PLAN.md'}
        result:
          - {id: plan, name: PLAN.md, checks: [written before the first launch (file mtime earlier than every run card), thresholds stated, wall-time estimate present]}
        rationale: fit_protocol 2, 0.6
      - id: verify_build
        name: Verify the ESPEI build that is actually imported
        kind: deterministic
        text: >-
          From the interpreter that will run every fit, print espei.__version__ and espei.__file__. It must read
          0.8.11.dev82+g9039ea215. Write both into every run card and result file. Do not set SETUPTOOLS_SCM_PRETEND_VERSION
          (it hides the commit). Environment names are not evidence.
        supply: []
        tool: {name: python, command: '<fit-python> -c "import espei, pycalphad; print(espei.__version__, espei.__file__, pycalphad.__version__)"', environment: fit_env}
        result:
          - {id: build_record, name: version line in every run card, checks: [espei 0.8.11.dev82+g9039ea215, pycalphad 0.11.3.dev35+g9a6939dd2]}
        gates: [G1_software_build]
        rationale: fit_protocol 0.5
      - id: check_gradients
        name: Check the gradient build against ESPEI 0.9.0 and finite differences
        kind: numerical
        text: >-
          Before a campaign on a new system or a new build, evaluate the log-likelihood and its gradient at the reference
          parameters and at a few random points with the gradient build and with ESPEI 0.9.0, term by term, and compare the
          gradient with central finite differences away from phase switches. Record the agreement and the nonsmooth regions.
          Repeat the term-by-term FD comparison at the endpoints of every fit step before its pick: a term class whose
          analytic gradient disagrees with FD (stable under a tenfold change of the FD step) is named in polish.fd_terms, and
          the eligibility norm of fit_protocol 10a is the norm of that verified gradient (6 Nov 2026: gradient ESPEI 9039ea2
          ActivityResidual at the Cr-Ni step-3b endpoint, |analytic - FD| 1.35 of 3.48; ZPFResidual at Cu-Zr H1 s1, 0.31 of 8.69).
        supply: [verify_build.build_record]
        tool: {name: gradient check, command: '<fit-python> -I protocols/tools/gradient_check.py <start.tdb> <config.json> --points 5 --seed 20261106 --out results/gradient_check.json', code: protocol_tools, environment: fit_env, note: wraps the cr-ni-rebuild-20261105/tests procedure (ESPEI 0.9.0 comparison runs with <home>/orchid-crni-mcmc-20261105/env/uq)}
        result:
          - {id: gradient_check, name: results/gradient_check.json, checks: [term-by-term agreement ~1e-9, FD agreement reported]}
        tolerances:
          - {quantity: log-likelihood difference gradient build vs ESPEI 0.9.0, rule: absolute, value: 1.0e-9, unit: log-units}
        rationale: fit_protocol 0.5, 11
      - id: reproduce_reference
        name: Reproduce the reference assessment first
        kind: numerical
        text: >-
          When a published assessment with a TDB exists, compute its diagram and score it on exactly the objective the
          candidates will use; record discrepancies between the paper and the distributed TDB. An unexpectedly large
          penalty is a reason to audit labels, units and signs before fitting.
        supply: [input:orchid_evidence, verify_build.build_record]
        tool: {name: score the reference TDB, command: '<fit-python> -I protocols/tools/evaluate_states.py <reference.tdb> assessments/<artifact>/evidence/states.json results/reference_states.json --nproc 4', code: protocol_tools, environment: fit_env}
        result:
          - {id: reference_check, name: results/reference_check.json, checks: [reference scored on the common objective, offending states listed]}
        tolerances:
          - {quantity: invariant temperatures of the reference reproduced from its TDB, rule: absolute, value: 2, unit: K}
        rationale: fit_protocol 0.5, 11

  - id: s1_evidence
    name: Evidence, exclusions, weights and the consistency check
    rationale: fit_protocol 0.2, 0.2a, 0.4a, item 8, 3, 4, 6, 7, 8
    steps:
      - id: build_datasets
        name: Build the step datasets from ORCHID at a pinned commit
        kind: deterministic
        text: >-
          Copy the ESPEI datasets of the system from orchid-data-next espei/ at the pinned commit into data/<group>/
          (liq: ZPF rows containing LIQUID; thermo: activities, HM_MIX, HM_FORM, DFT; solid: ZPF rows without LIQUID;
          dense: assessed dense grids, kept as their own evidence class). Values, sigma and weights unchanged; keep only
          phase regions whose phases are all in the model (drop, never rename); write a manifest with source path,
          sha256 and rows kept/dropped per file. Every observation not yet in ORCHID gets the sigma ORCHID's published
          rules would give it (literature/UNCERTAINTY_CALIBRATION.md) and is queued for extraction.
        supply: [input:orchid_evidence, write_plan.plan]
        tool: {name: build_data.py, command: '<fit-python> scripts/build_data.py', code: reference_fit_code, environment: fit_env}
        result:
          - {id: datasets, name: data/<group>/*.json, checks: [values identical to the ORCHID files]}
          - {id: manifest, name: data manifest with sha256 per file, checks: [rows kept + dropped = rows read]}
        rationale: fit_protocol 3, 0.2
      - id: partial_tielines
        name: Encode partial tie-lines and one-sided liquidus points
        kind: deterministic
        text: >-
          Where only one end of a tie-line is reported, write two observations of the same parent: (i) the known phase at
          its reported composition and (ii) a ZPF vertex pair of the known phase with the partner phase at null composition
          (zero phase fraction). Liquidus-only points (temperature printed, no solid named) are written as liquid + primary
          solid at T with the solid composition null, the primary solid taken from the source's own diagram, labelled as an
          interpretation; ambiguous primary solids are held, not guessed. Never drop the partner phase, never invent the
          missing composition.
        supply: [build_datasets.datasets]
        tool: {name: build_data.py (partial tie-line split), command: '<fit-python> scripts/build_data.py   # the (i)/(ii) split is part of build_data.py', code: reference_fit_code, environment: fit_env}
        result:
          - {id: split_datasets, name: '(i) and (ii) files of 0.4a, labelled', checks: [both derived from the same parent observation, no composition written for the partner]}
        rationale: fit_protocol 0.4a; memory exclusions-required-held-free item 4
      - id: exclusions_every_state
        name: Add excluded phases at every observed state
        kind: deterministic
        text: >-
          For every observed state of every dataset that enters the objective, single-phase states included, list the
          phases of the model that are stable elsewhere in the system but not at that state (relation adjacent_field,
          adjacent_line or stable_elsewhere, ORCHID excluded_phases), and write hinge cells in the format of espei/SCHEMA.md
          (T, x, expected, tie_line, penalize, sigma, confidence, orchid{observation_id, state_id,
          hull_tolerance_J_per_mol_atom}). An exclusion at an OBSERVED state (the phase is stable elsewhere but absent from
          the measured assemblage) enters at confidence 1.0, never down-weighted; its sigma is 10 J/mol-atom where the absence
          is certain (a phase never reported in a well-studied, replicated region) and otherwise the state's own uncertainty
          converted to energy (sigma_T |dS|, or the composition equivalent); tau stays 100. Only exclusions assumed from a
          diagram (not observed) enter by option C (sigma 1000 J/mol-atom, tau 100, confidence 0.5); both kinds are labelled.
          Exclusions from thermochemical states only where the state lies above every experimental liquidus observation at
          that composition. List every state that still lacks a cell and why.
        supply: [partial_tielines.split_datasets, param:hull_tolerance_tau, param:observed_absence, param:option_c_exclusions]
        tool: {name: build_hinge_complete.py, command: '<fit-python> scripts/build_hinge_complete.py', code: reference_fit_code, environment: fit_env}
        result:
          - {id: hinge, name: data/hinge/<step>_hinge.json, checks: [every observed state has a cell or a listed reason, option C cells labelled]}
          - {id: exclusion_audit, name: results/exclusion_audit.json}
        gates: [G4_exclusions_present]
        note: 'whether an absence is "certain" (sigma 10) is a judgement - the coordinator proposes, the PI confirms (OPEN_QUESTIONS Q32)'
        rationale: fit_protocol item 8, 0.4a (PI 6 Nov)
      - id: classify_certainty
        name: Classify the certainty tier of every ZPF and exclusion observation
        kind: deterministic
        text: >-
          Build the evidence bundle of the fit (a NEW bundle version when anything changes) and grade every term. Each
          phase EXCLUDED at a state gets its own tier from that state's distance to the phase's own observed field or
          boundary, in the state's T/x uncertainties - 10 J/mol-atom beyond 3 uncertainties with no source reporting the
          phase there; 50 within 3, or supported by a single source; 100 when adjacent, assumed from a diagram, or
          contested. Each ZPF record gets 100 when it is a boundary or tie-line record and 50 when independent sources
          replicate it within their uncertainty; single-phase field states are graded by their distance to the nearest
          boundary of their own phase. Observed states enter at confidence 1.0. Write exclusions[] (phase, tier, energy
          scale, basis) and zpf_certainty into states@<version>.json; the objective's ZPF and hinge scales come from them.
          Hinge floor (item 8): each exclusion's hinge scale is sigma = max(tier, the state's T and x uncertainty converted
          to energy as for sigma_DF, at the previous accepted step); write the converted value, the tier and the scale used
          per (state, excluded phase) beside the hinge file.
        supply: [exclusions_every_state.hinge, param:certainty_tiers, param:observed_absence, param:hinge_sigma_floor]
        tool: {name: build_evidence_bundle.py, command: '<fit-python> -I protocols/tools/build_evidence_bundle.py generic --art <artifact> --element <EL> --run-card <run card listing the data files> --hinge <hinge.json> --oneshot results/oneshot_observations.json --pick <pick.tdb> --registry <Y25 graph/observations.parquet> --version <new bundle version>', code: protocol_tools, environment: fit_env}
        result:
          - {id: states, name: 'assessments/<artifact>/evidence/states@<version>.json (zpf_certainty per state; exclusions[] with a tier per excluded phase)', checks: [every ZPF record and every excluded phase has a tier and a basis]}
          - {id: bundle, name: assessments/<artifact>/evidence/MANIFEST.json (bundle sha256), checks: [no source-text field over 500 characters]}
        rationale: fit_protocol item 8 (certainty tiers, PI 6 Nov)
      - id: weights_from_sigma
        name: Set every weight from the observation's own uncertainty
        kind: deterministic
        text: >-
          ESPEI weight = ESPEI default standard deviation / sigma of the observation, with sigma =
          uncertainty_budget.sigma_effective for ORCHID records (converted as the ESPEI bundle does, espei/SCHEMA.md). No
          hand-set multipliers. Repeated quotations of one measurement count once. Assessed dense grids are reported as
          their own evidence class and are never up-weighted.
        supply: [exclusions_every_state.hinge, param:espei_default_sd]
        tool: {name: build_data.py (weights), command: '<fit-python> scripts/build_data.py && <fit-python> scripts/data_consistency.py   # weights are written by build_data.py and audited by data_consistency.py item 1', code: reference_fit_code, environment: fit_env}
        result:
          - {id: weighted_datasets, name: datasets with weights, checks: [no dataset at a software default sigma except the ZPF driving-force scale (OPEN_QUESTIONS Q11)]}
        rationale: fit_protocol 0.2
      - id: data_consistency
        name: Run the data consistency check (flags only)
        kind: deterministic
        text: >-
          Run the seven checks of fit_protocol 0.2a on every dataset that enters the objective (uncertainty present with a
          basis; within-series jumps and bounds; cross-quantity tests such as Gibbs-Duhem; basis and units; duplicates;
          cross-source disagreement; pull at the reference). Write results/data_consistency.json. It flags; it never changes
          data. A flagged value stays at its uncertainty unless the PI holds it; report the fit with and without it when it
          matters.
        supply: [weights_from_sigma.weighted_datasets, reproduce_reference.reference_check]
        tool: {name: data_consistency.py, command: '<fit-python> scripts/data_consistency.py', code: reference_fit_code, environment: fit_env}
        result:
          - {id: consistency, name: results/data_consistency.json, checks: [seven items present, flagged values listed with record ids]}
        gates: [G3_data_consistency_run]
        rationale: fit_protocol 0.2a
      - id: evidence_ledger
        name: Reconcile the evidence ledger and the ORCHID export ledger
        kind: deterministic
        text: >-
          Write the evidence ledger (every observation with its ORC id, state_id, evidence class, sigma and disposition
          included / validation / duplicate / held / out_of_scope / invalid_extraction) and the export ledger of every new
          or derived item (extractions, interpretations, campaign-added exclusions) with its provisional or canonical id and
          its review and delivery status. No record disappears because a loader cannot represent it. Single-reader records
          may enter a fit labelled; a second reading is needed before release, not before fitting.
        supply: [data_consistency.consistency]
        tool: {name: evidence bundle + intake, command: '<fit-python> -I protocols/tools/build_evidence_bundle.py generic --art <artifact> --element <EL> --run-card <run card> --hinge <hinge.json> --registry <Y25 observations.parquet> && python3 protocols/tools/prepare_intake.py assessments/<artifact>', code: protocol_tools, note: 'the bundle MANIFEST.json + states.json is the evidence ledger; intake/ is the contribution manifest (fit_protocol 14 names; OPEN_QUESTIONS Q16)'}
        result:
          - {id: ledger, name: evidence_ledger.jsonl + contribution_manifest.json, checks: [counts reconcile acquisition -> export -> objective]}
        rationale: fit_protocol 3, 4

  - id: s2_oneshot
    name: PhaseForge one-shot (frozen, fit_protocol 0.0a) = step 1 of the sequence
    rationale: fit_protocol 0.0a, 0.0b, 5, 9, 10
    steps:
      - id: gen_sqs
        name: Generate the SQS cells with m_scraps
        kind: deterministic
        text: >-
          Generate 128-atom SQS for bcc and fcc (and at least 108 atoms for hcp; 128 is the precedent) with m_scraps 0.6.0,
          two seeds per composition, over the whole composition grid, plus both pure elements in the same supercells.
          Settings: weighted_l1 objective, figure cut-offs in nearest-neighbour units (2.05, 1.45, 1.05) fcc/hcp and
          (2.05, 1.20, 1.05) bcc, auto_budget 2. Record the seeds, check all seed pairs are distinct, hash every POSCAR.
        supply: [param:sqs_atoms_bcc_fcc, param:sqs_atoms_hcp_min, param:sqs_seeds, param:sqs_composition_grid, write_plan.plan]
        tool: {name: gen_sqs.py, command: '<home>/.venvs/phaseforge/bin/python code/gen_sqs.py inputs/structures', code: reference_oneshot_code, environment: sqs_env}
        result:
          - {id: sqs_cells, name: inputs/structures/<LATTICE>/<cell>/POSCAR, checks: [atom counts, distinct seed pairs, logs/gen_sqs.log]}
        rationale: fit_protocol 0.0a SQS
      - id: staged_relax
        name: Relax every SQS and compound in stages, with a lattice check after each
        kind: numerical
        text: >-
          Run every cell with the value potential and the cross-check potential, in detached containers on an approved GPU
          host (check load first; never spark4): s0 unrelaxed at the Vegard volume of the MLIP same-lattice pure elements
          (static); s1 isotropic volume; s2 volume + ions with the shape fixed (the protocol value); s3 full (lower bound,
          kept even if the lattice changes). After each stage check the lattice (SQS: displacements, coordination, s3
          shape strain; compounds: displacements + spglib space group). Keep every stage of every cell; never drop a cell
          that transforms. Record container names and host PIDs in logs/launch_solids.tsv. Pull results read-only.
        supply: [gen_sqs.sqs_cells, input:structures, input:mlip_weights, param:relaxation_stages, param:relaxation_optimizer, param:potential]
        tool: {name: relax_solids.py in the GPU container, command: 'docker run -d --gpus all --name <campaign>-solids-<tag> --ipc=host -e XLA_FLAGS=--xla_gpu_cuda_data_dir=/opt/cuda13 -v /usr/local/cuda-13.0:/opt/cuda13:ro -v $R:/campaign -v $R/inputs/potential:/root/.cache/grace:ro cuzr-phaseforge-grace-gpu:20261104 sh -c "python -u /campaign/code/relax_solids.py <MODEL> > /campaign/logs/solids-<tag>.log 2>&1"', code: reference_oneshot_code, environment: mlip_container, host_class: DGX Spark GPU}
        result:
          - {id: solids_raw, name: collected_solids/<MODEL>/<LATTICE>/<cell>/result.json, checks: [4 stages per cell, lattice check per stage]}
        tolerances:
          - {quantity: 's2 mixing or formation energy per cell on a rerun (GPU, same image and weights)', rule: absolute, value: 0.1, unit: kJ/mol-atom}
          - {quantity: lattice-check verdict per cell and stage, rule: categorical_identical}
        rationale: fit_protocol 0.0a Relaxation; mlip-relaxation-protocol
      - id: value_rule
        name: Apply the value rule and assign sigma per point
        kind: deterministic
        text: >-
          Per composition and lattice: if the s2 lattice check passes, the value is the s2 seed mean; otherwise the value is
          the midpoint of [s3, s0] and its half-width is the uncertainty. sigma_i = max(sigma_MLIP, s0 - s2, s2 - s3, half
          seed spread) for s2 values, max(sigma_MLIP, half-width) for midpoint values. Mixing energies relative to the
          same-lattice MLIP end-members (s2 pure cells); compound formation energies relative to the MLIP pure elements in
          their SGTE stable structures. A compound "keeps its structure" when its s2 space group equals the prototype's
          (Cu-Zr precedent, coordinator decision, labelled; OPEN_QUESTIONS Q09).
        supply: [staged_relax.solids_raw, input:sigma_mlip, param:value_rule, param:sigma_mlip]
        tool: {name: analyze_solids.py / build_oneshot.py, command: '<fit-python> code/build_oneshot.py', code: reference_oneshot_code, environment: fit_env}
        result:
          - {id: solids_summary, name: results/solids_<MODEL>.json, checks: [every cell present, value rule recorded per point]}
          - {id: oneshot_observations, name: results/oneshot_observations.json, checks: [value and sigma per observation, sigma_basis]}
        rationale: fit_protocol 0.0a (midpoint rule PI 6 Nov)
      - id: liquid_md
        name: Run the liquid MD (100 ps production)
        kind: numerical
        text: >-
          With the value potential, run the liquid at five compositions (x 0, 0.25, 0.5, 0.75, 1) with 108 atoms and one
          864-atom check at x 0.5, all at the same temperature just above the highest melting point: 2 ps premelt at
          3500 K, NPT density equilibration, NVT equilibration, 100 ps NVT production, positions and velocities saved
          every 2 fs. Seeds fixed and recorded. Check every run is liquid (species MSD/diffusion, RDF, no crystallisation)
          and keep failed runs with their disposition (e.g. analyse a run that crystallised over its liquid window only).
        supply: [input:mlip_weights, param:liquid_md, param:potential]
        tool: {name: run_liquid.py in the GPU container, command: 'docker run -d --gpus all --name <campaign>-liq-<tag> ... cuzr-phaseforge-grace-gpu:20261104 sh -c "python -u /campaign/code/run_liquid.py --size <108|864> --x-<el> <x> --seed <seed> --model GRACE-2L-SMAX-OMAT-large"', code: reference_oneshot_code, environment: mlip_container, host_class: DGX Spark GPU}
        result:
          - {id: liquid_runs, name: 'collected_liquid/<run>/ (thermo.jsonl, positions, velocities)', checks: [liquid by MSD, production 100 ps]}
        tolerances:
          - {quantity: H_mix at x 0.25/0.5/0.75 on a rerun, rule: absolute, value: 0.5, unit: kJ/mol-atom}
          - {quantity: S_ex at x 0.25/0.5/0.75 on a rerun, rule: absolute, value: 0.3, unit: J/mol-atom/K}
        rationale: fit_protocol 0.0a Liquid, 9, 10.C
      - id: liquid_entropy
        name: Compute the liquid excess entropy with MLIPentropy (ideal-mixing check first)
        kind: numerical
        text: >-
          Convert the production runs to ASE trajectories with positions and velocities on the same frames, then run
          MLIPentropy with the pure-liquid references at the same T. The ideal-mixing check (random labels on the MD
          neighbour graphs) must give |S_chem,ex| at or below its tolerance before any value is used. S_ex = vibrational
          (VACF) + corrected chemical (pair/quasi-chemical) term; excess electronic entropy taken as zero (assumption).
          Apply the 108/864 finite-size rule. Values enter later steps as SM_MIX observations labelled provisional.
        supply: [liquid_md.liquid_runs, param:finite_size_acceptance, param:electronic_excess_entropy]
        tool: {name: MLIPentropy, command: 'MLIPentropy -temp=<T> -dt=2 -ref=<A_liq.traj> -ref=<B_liq.traj> -alloy=<x025.traj> -alloy=<x050.traj> -alloy=<x075.traj> -o results/liquid_excess_entropy.json', code: mlipentropy, environment: fit_env}
        result:
          - {id: liquid_sex, name: results/liquid_excess_entropy.json, checks: [ideal-mixing check passed, finite-size check reported, provisional label]}
        tolerances:
          - {quantity: 'S_ex per composition from the same trajectories (deterministic estimator, fixed seed)', rule: absolute, value: 1.0e-6, unit: J/mol-atom/K}
        rationale: fit_protocol 10.D; docs/protocols/liquid-entropy.md
      - id: build_oneshot_tdb
        name: Fit Redlich-Kister terms and write the one-shot TDB with SGTE end-members
        kind: deterministic
        text: >-
          Weighted least squares (weights 1/sigma_fit^2, sigma_fit = max(half [s3, s0] interval, half seed spread,
          0.1 kJ)) of the protocol values for the solution phases (L0 + L1, a-terms only); liquid L0 (+ L1) a-terms from
          H_mix and, for the S_ex variant, b-terms from S_ex; compounds as line compounds G = sum of SGTE unaries +
          (a+b) H_f. Elements and interaction parameters in alphabetical order. Interaction and compound terms are written
          as VV symbols (VV0000...) so the fit steps can move them; the T-coefficient symbols start at 0. Pure-element
          end-members are the SGTE unaries copied verbatim, never fitted.
        supply: [value_rule.solids_summary, liquid_md.liquid_runs, liquid_entropy.liquid_sex, input:unaries, param:rk_order, param:references]
        tool: {name: build_tdb.py / build_oneshot.py + make_base.py, command: '<fit-python> code/build_oneshot.py && <fit-python> scripts/make_base.py', code: reference_oneshot_code, environment: fit_env}
        result:
          - {id: oneshot_tdb, name: tdb/step1_oneshot.tdb, checks: [SGTE unary lines identical to the source TDB, VV layout recorded, sha256 recorded]}
        rationale: fit_protocol 0.0a Fit and TDB
      - id: oneshot_diagram
        name: Draw the one-shot diagram and run the pure-element check
        kind: deterministic
        text: >-
          Compute the diagram of the one-shot TDB over the declared T range, run the pure-element check (stable phase
          sequence and melting points equal SGTE; ordered end-members equal their disordered parent) and record which
          phases exist and where. Look at the diagram. This is step 1 of the sequence: no fitting.
        supply: [build_oneshot_tdb.oneshot_tdb]
        tool: {name: evaluate.py / evaluate_step.py, command: '<fit-python> scripts/evaluate.py step1_oneshot', code: reference_fit_code, environment: fit_env}
        result:
          - {id: oneshot_eval, name: steps/step1_oneshot/evaluation.json + figure, checks: [pure elements = SGTE, phases recorded]}
        gates: [G2_pure_elements]
        rationale: fit_protocol 0.1 step 1; unary-limits-fixed

  - id: s3_fit_sequence
    name: Staged fit from the liquid down (fit_protocol 0.1)
    text: >-
      Every fit step below is executed by the same fit procedure (fit_step), followed by evaluate_and_pick. Each step starts
      from the previous ACCEPTED step and is versioned in steps/<step>/. "Held" never means fixed: every phase and compound
      stays free in every step, anchored by its one-shot value entered as an observation at its sigma (PI 6 Nov). A step
      that breaks the topology is reported, not silently continued.
    rationale: fit_protocol 0.1, 0.2, 0.3, 0.4, 12
    steps:
      - id: fit_liquidus
        name: Step 2, liquidus
        kind: numerical
        text: >-
          Fit with data groups oneshot + liq: the liquid-containing ZPF rows ((i)+(ii) files of 0.4a), invariants involving
          the liquid, the provisional liquid S_ex (SM_MIX, weight 0.2/u) and every one-shot observation at its sigma. Free:
          the liquid a,b terms, the solution a,b terms and the compound a,b terms (held = anchored, not fixed). Multistart
          with the starts_per_step rule; record the full trajectory (record_trajectory). Before step 3: no solid stable above
          the liquidus anywhere; liquid stable at high T; invariants involving the liquid.
        supply: [oneshot_diagram.oneshot_eval, build_oneshot_tdb.oneshot_tdb, value_rule.oneshot_observations, liquid_entropy.liquid_sex, exclusions_every_state.hinge, weights_from_sigma.weighted_datasets, param:starts_per_step, param:optimizer, param:wall_budget_per_start]
        tool: {name: fit.py (multistart MAP), command: 'cd <campaign> && PYTHONPATH=<home>/src/PhaseForgePlus/src OMP_NUM_THREADS=1 <fit-python> scripts/fit.py steps/configs/step2_liquidus.json <nproc> 7', code: reference_fit_code, environment: fit_env}
        result:
          - {id: starts, name: 'steps/step2_liquidus/ (run_card.json, multistart.json, s*.tdb, trajectory.jsonl)', checks: [espei.__version__ in run card, every start kept]}
        tolerances:
          - {quantity: 'log posterior of each start on a rerun (same build, CPU, OMP_NUM_THREADS=1)', rule: absolute, value: 0.01, unit: log-units}
          - {quantity: parameters of the picked start on a rerun, rule: absolute, value: null, note: 'fit_protocol 10b - per-parameter absolute tolerance declared in the specific protocol'}
        rationale: fit_protocol 0.1 step 2
      - id: polish_starts
        name: Polish every start to convergence (after every fit step)
        kind: numerical
        text: >-
          After the multistart of every fit step (fit_liquidus, fit_thermo, fit_solid and system-specific fit steps), continue
          each start from its endpoint with the same objective and the polish settings until the verified gradient norm
          (check_gradients) is below pick_gradient_threshold or the evaluation cap is reached. Keep the pre-polish results
          (multistart_prepolish.json, s<k>/ files) as recorded runs. Report every start's norm before and after, its status
          and its parameter changes; a start that reaches the cap unconverged stays ineligible. Then pick (10a) among the
          converged starts only; if none converged, report it and do not loosen the threshold.
        supply: [fit_liquidus.starts, check_gradients.gradient_check, param:polish, param:pick_gradient_threshold]
        tool: {name: polish_starts.py, command: '<python> protocols/tools/polish_starts.py crni|cuzr <step> [--starts ...] --max-evals <cap> --fd-terms <failed term classes>; then python3 protocols/tools/pick_start.py steps/<step> --threshold <plan value> (Cr-Ni) or polish_starts.py cuzr-pick <step> (Cu-Zr)', code: protocol_tools, environment: fit_env}
        result:
          - {id: polished, name: 'steps/<step>/multistart.json (polished, with polish records) + multistart_prepolish.json + polish_report.json; or s<k>/polish/', checks: [pre-polish results kept, settings recorded, every start reported]}
          - {id: pick_10a, name: steps/<step>/pick_protocol_10a.json, checks: [only converged starts eligible, threshold as stated in the plan]}
        tolerances:
          - {quantity: polished parameters of the pick across machines, rule: absolute, value: null, note: 'fit_protocol 10b - per-parameter absolute tolerances of the specific protocol'}
        rationale: fit_protocol 10a; coordinator decision 6 Nov 2026
      - id: pick_liquidus
        name: Look at the diagrams, rank the starts and pick (step 2)
        kind: judgement
        text: >-
          For every start: diagram over the declared T range, topology check, pure-element check, one-shot shifts in units
          of sigma, plausibility. Rank by fit_protocol 0.3 (plausible energies, then topology with spurious-field severity
          by temperature, then quantitative). Look at the pick's diagram before naming it. Copy the pick to
          tdb/step2_liquidus_pick.tdb.
        supply: [fit_liquidus.starts]
        tool: {name: evaluate.py, command: '<fit-python> scripts/evaluate.py step2_liquidus [pick_start_name]', code: reference_fit_code, environment: fit_env}
        result:
          - {id: pick, name: steps/step2_liquidus/evaluation.json + tdb/step2_liquidus_pick.tdb + figure, checks: [ranking recorded, pick diagram looked at]}
        decision_rule: 'fit_protocol 10a - only starts with gradient norm below pick_gradient_threshold are eligible (python3 protocols/tools/pick_start.py steps/<step> --threshold <plan value>); rank eligible starts by R1-R3 classes (plausible; topology class) and break near-ties by the objective, never by grid quantities; if no start is eligible, report it and do not loosen the threshold'
        decided_by: campaign coordinator (agent), reported to the PI; PI decides when no fit is plausible or the topology is wrong in every start
        ranking_criteria: [R1_plausible_energies, R2_topology, R3_quantitative]
        gates: [G2_pure_elements]
        rationale: fit_protocol 0.3, 0.1
      - id: fit_thermo
        name: Step 3, thermochemistry
        kind: numerical
        text: >-
          From the step-2 pick, add calorimetry, activities and mixing enthalpies (and DFT where ORCHID holds it) at their
          own sigma. Same free set; widen a compound's sigma only where calorimetry for it exists. Multistart; record the
          trajectory. Before step 4: topology unchanged; thermochemical residuals by dataset.
        supply: [pick_liquidus.pick, weights_from_sigma.weighted_datasets, value_rule.oneshot_observations, param:starts_per_step]
        tool: {name: fit.py, command: 'cd <campaign> && PYTHONPATH=<home>/src/PhaseForgePlus/src OMP_NUM_THREADS=1 <fit-python> scripts/fit.py steps/configs/step3_thermo.json <nproc> 7', code: reference_fit_code, environment: fit_env}
        result:
          - {id: starts, name: steps/step3_thermo/, checks: [as step 2]}
        tolerances:
          - {quantity: log posterior of each start on a rerun, rule: absolute, value: 0.01, unit: log-units}
        rationale: fit_protocol 0.1 step 3
      - id: pick_thermo
        name: Rank and pick (step 3)
        kind: judgement
        text: As pick_liquidus, for step 3; copy the pick to tdb/step3_thermo_pick.tdb.
        supply: [fit_thermo.starts]
        tool: {name: evaluate.py, command: '<fit-python> scripts/evaluate.py step3_thermo', code: reference_fit_code, environment: fit_env}
        result:
          - {id: pick, name: steps/step3_thermo/evaluation.json + pick TDB}
        decision_rule: 'as pick_liquidus (10a eligibility and objective tie-break); a step that breaks the topology is reported and the cause found before it is repeated (e.g. Cr-Ni 3a, a compound fixed instead of anchored)'
        decided_by: campaign coordinator (agent), reported to the PI
        ranking_criteria: [R1_plausible_energies, R2_topology, R3_quantitative]
        rationale: fit_protocol 0.3
      - id: fit_solid
        name: Step 4, solid state
        kind: numerical
        text: >-
          From the step-3 pick, add the solid-state ZPF rows, dense assemblages (as their own evidence class) and the hinge
          of excluded phases at every observed state. Multistart; record the trajectory. Before step 5: full topology over
          the declared T range; spurious-field severity by temperature.
        supply: [pick_thermo.pick, exclusions_every_state.hinge, weights_from_sigma.weighted_datasets, param:starts_per_step]
        tool: {name: fit.py, command: 'cd <campaign> && PYTHONPATH=<home>/src/PhaseForgePlus/src OMP_NUM_THREADS=1 <fit-python> scripts/fit.py steps/configs/step4_solid.json <nproc> 7', code: reference_fit_code, environment: fit_env}
        result:
          - {id: starts, name: steps/step4_solid/}
        tolerances:
          - {quantity: log posterior of each start on a rerun, rule: absolute, value: 0.01, unit: log-units}
        rationale: fit_protocol 0.1 step 4, item 8
      - id: topology_moves
        name: When the topology moves, add ZPF evidence (not a special term)
        kind: judgement
        text: >-
          If the ranked fits of a step have the wrong topology, find which observations pull against the right topology
          (by dataset and evidence class), add the ZPF evidence that exists (the invariant observations of the reactions in
          question, two-phase points around them, excluded phases by item 8), all from ORCHID records with their ids, and
          refit from the last step at the same uncertainty-derived weights, as a new labelled step. Never hand-edit
          parameters and never add a topology penalty. If honest weights still cannot reach the right topology with
          plausible energies, report it as a finding about the data and the model.
        supply: [fit_solid.starts]
        tool: {name: 'per-dataset pull (topology_cost.py, zpf_by_file.py, per_dataset.py)', command: '<fit-python> scripts/per_dataset.py tdb/<wrong-topology pick>.tdb results/per_dataset_<step>.json && <fit-python> -I protocols/tools/evaluate_states.py tdb/<pick>.tdb assessments/<artifact>/evidence/states.json results/states_<step>.json   # then compare the pulls of the datasets that hold the reactions in question', code: reference_fit_code, environment: fit_env}
        result:
          - {id: pull_report, name: results/topology_pull.json or a labelled extra step (e.g. Cu-Zr H1/H2), checks: [observations that conflict listed with ids]}
        decision_rule: add only evidence that exists in ORCHID (ids); a new step needs a new config and run cards; same weights
        decided_by: PI for any new data class or encoding; coordinator for adding existing ORCHID invariant/exclusion cells
        rationale: fit_protocol 0.4
      - id: same_phase_split
        name: Check same-phase splitting and decide on a convexity constraint
        kind: judgement
        text: >-
          For each solution phase with single-phase observations, check whether the fit splits it into two composition
          sets. If there is no source report of a miscibility gap and the mixing energies do not suggest one (regular-solution
          T_c with the SRO factor, Cahn's coherent term, excess vibrational entropy, DFT/MLIP error on Omega), apply a
          convexity constraint at the observed single-phase states only; otherwise leave it to the data and report the
          topology uncertainty. Temperature gate (0.4b): the constraint applies only at observed single-phase states above
          convexity_T_allow of that phase, set before fitting from the corrected T_c estimates (SRO, excess vibrational
          entropy, Cahn coherency) with their basis; below it concavity is left to the data. Its energy scale follows the
          state's certainty tier. Report the sensitivity of the result to T_allow.
        supply: [fit_solid.starts]
        tool: {name: physics.py, command: '<fit-python> scripts/physics.py <tdb> results/physics_<step>.json', code: reference_fit_code, environment: fit_env}
        result:
          - {id: gap_assessment, name: results/physics_<step>.json, checks: [chemical and coherent results both reported]}
        decision_rule: 'convexity term only if both the incoherent estimate and Cahn''s term make a gap unlikely and no source reports one; applied only above convexity_T_allow (0.4b)'
        decided_by: campaign coordinator, reported; PI if the decision changes the model
        rationale: fit_protocol 0.4b (incl. the temperature gate, b2d612d), 0.4c
      - id: pick_solid
        name: Rank and pick (step 4)
        kind: judgement
        text: As pick_liquidus, for step 4; copy the pick to tdb/step4_solid_pick.tdb.
        supply: [fit_solid.starts, same_phase_split.gap_assessment, topology_moves.pull_report]
        tool: {name: evaluate.py, command: '<fit-python> scripts/evaluate.py step4_solid', code: reference_fit_code, environment: fit_env}
        result:
          - {id: pick, name: steps/step4_solid/evaluation.json + pick TDB}
        decision_rule: 'as pick_liquidus (10a eligibility and objective tie-break)'
        decided_by: campaign coordinator (agent), reported to the PI
        ranking_criteria: [R1_plausible_energies, R2_topology, R3_quantitative]
        rationale: fit_protocol 0.3, 10a
      - id: ambiguous_structures
        name: Step 5, ambiguous structures
        kind: judgement
        text: >-
          For phases with uncertain structures, do the best possible while keeping them within the DFT/MLIP error band
          (~10 kJ/mol-atom) of the MLIP hull; record the structure disposition (confirmed, provisional candidate or
          analogue, unresolved; fit_protocol 5). Write results/step5_ambiguous_structures.json even when none applies.
        supply: [pick_solid.pick]
        tool: {name: evaluation of the pick against the MLIP hull, command: '<fit-python> scripts/evaluate.py <step>   # writes oneshot_shifts (sigma units) and formation energies vs the MLIP values; record results/step5_ambiguous_structures.json', code: reference_fit_code}
        result:
          - {id: step5, name: results/step5_ambiguous_structures.json}
        decision_rule: a compound beyond the band is a note, not a rejection, unless calorimetry also disagrees
        decided_by: campaign coordinator, reported to the PI
        rationale: fit_protocol 0.1 step 5, 5
      - id: record_trajectory
        name: Record the trajectory of every start (REQUIRED)
        kind: deterministic
        text: >-
          For every fit step and every start, write one JSON line per objective evaluation to
          steps/<step>/<start>/trajectory.jsonl: evaluation index, wall time, optimizer stage, objective (log posterior or
          log-likelihood, named), its components (ZPF, activities, fixed-configuration properties split into thermochemistry,
          one-shot anchors and S_ex where the objective allows, hinge, prior), and the full parameter vector in physical
          units with the symbol names. Record the topology class wherever a diagram is evaluated (at least start and end).
          Existing campaigns without histories are shown start -> end only, labelled "trajectory not recorded".
        supply: [fit_liquidus.starts, fit_thermo.starts, fit_solid.starts]
        tool: {name: fit.py trace writer, command: 'written by scripts/fit.py itself (steps/<step>/<start>/trajectory.jsonl, one JSON line per evaluation; topology every TOPO_EVERY evaluations); verify with python3 protocols/tools/check_trajectory.py steps/<step>', note: 'Cu-Zr fit_step.py writes trace.jsonl per start; Cr-Ni fit.py records trajectory.jsonl since 6 Nov 06:55'}
        result:
          - {id: trajectory, name: steps/<step>/<start>/trajectory.jsonl, checks: [one line per evaluation, parameter names stated], required: true}
        gates: [G5_trajectory_recorded]
        rationale: PI 6 Nov (dashboard trajectory and model-space evolution)

  - id: s4_checks_rank
    name: Physics checks and the final ranking
    rationale: fit_protocol 0.3, 0.4c, 9, 13
    steps:
      - id: physics_checks
        name: Physics checks of the final candidates
        kind: deterministic
        text: >-
          For the final pick (and the runner-up): liquid convexity over the declared domain (min d2G/dx2 by T; no spurious
          liquid gap unless sources report one); metastable gaps of each solution (chemical spinodal top, coherent spinodal
          with Cahn's term, metastable binodal, incoherent T_c estimates); unary limits (excess terms vanish at the end points;
          stable pure phases equal SGTE); stable same-phase gaps.
        supply: [ambiguous_structures.step5, pick_solid.pick]
        tool: {name: physics.py, command: '<fit-python> scripts/physics.py tdb/<final>.tdb results/physics_final.json', code: reference_fit_code, environment: fit_env}
        result:
          - {id: physics, name: results/physics_final.json}
        gates: [G2_pure_elements]
        rationale: fit_protocol 0.4c, 9
      - id: evaluate_states
        name: Expected vs calculated assemblage at every observed state
        kind: deterministic
        text: >-
          For the pick TDB, compute the equilibrium assemblage (pycalphad, P = 101325 Pa) at every state of the evidence
          bundle, fit and coverage, and record expected vs calculated phases, match, contains-expected and excluded phases
          present, with ORC ids, state ids and certainty tiers. Deterministic for a fixed TDB and pycalphad build.
        supply: [pick_solid.pick, classify_certainty.states]
        tool: {name: evaluate_states.py, command: '<fit-python> -I protocols/tools/evaluate_states.py tdb/<final>.tdb assessments/<artifact>/evidence/states.json assessments/<artifact>/evidence/states_evaluated.json --nproc 4', code: protocol_tools, environment: fit_env}
        result:
          - {id: states_evaluated, name: assessments/<artifact>/evidence/states_evaluated.json, checks: [every state evaluated or listed as skipped, byte-identical on rerun]}
        rationale: fit_protocol 13 (unrestricted equilibrium over the declared phase set); PI 6 Nov (per-state agreement)
      - id: per_dataset
        name: Residuals by dataset at the pick
        kind: deterministic
        text: Compute residual/sigma per dataset file at the pick (rms, max, mean, n), every data group, and write them.
        supply: [pick_solid.pick, weights_from_sigma.weighted_datasets]
        tool: {name: per_dataset.py, command: '<fit-python> scripts/per_dataset.py tdb/<final>.tdb results/per_dataset_<final>.json', code: reference_fit_code, environment: fit_env}
        result:
          - {id: residuals, name: results/per_dataset_<final>.json}
        rationale: fit_protocol 0.3 item 3
      - id: final_pick
        name: Name the final pick
        kind: judgement
        text: >-
          State the plausibility thresholds (already in PLAN.md), rank the accepted step picks and their runner-ups, look at
          the diagram of the pick, and copy it to tdb/<System>_<campaign>_FINAL_<step>_<start>.tdb. Misses against
          experiment and the MLIP are listed as notes, not as rejections.
        supply: [physics_checks.physics, per_dataset.residuals, pick_solid.pick]
        tool: {name: evaluate.py + summarize.py, command: '<fit-python> scripts/summarize.py', code: reference_fit_code, environment: fit_env}
        result:
          - {id: final_tdb, name: tdb/<...>_FINAL_<step>_<start>.tdb, checks: [sha256 recorded]}
          - {id: step_summary, name: results/step_summary.json}
        decision_rule: rank fits, pick the reasonable one; topology first among fits with plausible energies; a right topology bought with implausible energies does not win
        decided_by: campaign coordinator proposes; PI accepts the pick for release
        ranking_criteria: [R1_plausible_energies, R2_topology, R3_quantitative]
        rationale: fit_protocol 0.3; rank-models-pick-reasonable

  - id: s5_uq
    name: Uncertainty (Laplace mixture; MCMC only if separately approved)
    rationale: fit_protocol 0.6, 13; Cr-Ni PLAN "cheap UQ"
    steps:
      - id: modes
        name: Collect the distinct optima
        kind: deterministic
        text: >-
          From the final step's multistart (plus restarts from perturbations of the pick if needed), group the converged
          starts into distinct modes by objective and parameters, and write results/uq/modes_<step>.json.
        supply: [final_pick.final_tdb, fit_solid.starts]
        tool: {name: laplace.py (mode list), command: '<fit-python> -c "import json; m=json.load(open(''steps/<step>/multistart.json'')); m=[x for x in m if x[''final'']==''converged'']; m.sort(key=lambda x:-x[''logpost'']); modes=[]; [modes.append(x) for x in m if all(abs(x[''logpost'']-y[''logpost''])>0.5 for y in modes)]; json.dump([{''name'':chr(65+i)+''_''+x[''start''],''theta'':x[''theta''],''logpost'':x[''logpost''],''grad_norm_q'':x[''grad_norm_q'']} for i,x in enumerate(modes)], open(''results/uq/modes_<step>.json'',''w''), indent=1)"', code: reference_fit_code, note: 'distinct modes = converged starts more than 0.5 log-units apart (the Cr-Ni modes_step4.json rule)'}
        result:
          - {id: modes, name: results/uq/modes_<step>.json}
        rationale: fit_protocol 13
      - id: laplace
        name: Laplace approximation at each mode and mixture weights
        kind: numerical
        text: >-
          At each mode compute -H by central differences of the analytic gradient at the two relative steps, symmetrise, and
          repair soft directions along the three softest eigenvectors when -H is not positive definite. Mixture weights:
          log w_k = logpost_k + d/2 log 2 pi - 1/2 log|-H_theta|. Draw laplace_draws parameter vectors from the mixture
          (fixed seed) and the independent-marginal counterexample.
        supply: [modes.modes, param:laplace_hessian_steps, param:laplace_draws]
        tool: {name: laplace.py, command: 'cd <campaign> && PYTHONPATH=<home>/src/PhaseForgePlus/src <fit-python> scripts/laplace.py steps/configs/<step>.json results/uq/modes_<step>.json results/uq/laplace_<step>.json 1000', code: reference_fit_code, environment: fit_env}
        result:
          - {id: laplace, name: results/uq/laplace_<step>.json + laplace_<step>.draws.npy}
        tolerances:
          - {quantity: mixture weight of the main mode on a rerun, rule: absolute, value: 0.01}
          - {quantity: eigenvalues of -H in q, rule: relative, value: 0.05}
        rationale: fit_protocol 13
      - id: classify_draws
        name: Classify the draws and propagate
        kind: numerical
        text: >-
          Classify every draw on a 5 K grid over the declared T range: accepted topology (strict, and apart from narrow
          windows declared in PLAN.md), gaps by phase, spurious fields, invariant temperatures; report probabilities with
          binomial errors, and the independent-marginal comparison.
        supply: [laplace.laplace]
        tool: {name: classify_draws.py, command: '<fit-python> scripts/classify_draws.py results/uq/laplace_<step>.draws.npy results/uq/classified_mixture_draws.json', code: reference_fit_code, environment: fit_env}
        result:
          - {id: uq_summary, name: results/uq/classified_mixture_draws.json}
        tolerances:
          - {quantity: P(accepted topology) on a rerun with the same draws, rule: absolute, value: 0.0}
          - {quantity: P(accepted topology) on a rerun with new draws, rule: absolute, value: 0.03}
        rationale: fit_protocol 0.6, 13
      - id: mcmc_optional
        name: MCMC only if separately approved
        kind: judgement
        text: >-
          MCMC is not part of this protocol by default. If the PI approves it for a campaign, follow fit_protocol 0.6
          (ESPEI's own likelihood on CPU; approved Sparks spark1, spark2, spark3, never spark4; Vision needs the PI's go; walkers at
          MAP + a ball scaled by the Laplace covariance; convergence rules fixed before sampling; above ~12 h stop for a
          decision).
        supply: [classify_draws.uq_summary, param:mcmc_stop_hours]
        tool: {name: ESPEI 0.9.0 MCMC (calphad-uq), note: only with a recorded PI approval}
        result:
          - {id: mcmc, name: results/uq/mcmc_* (when approved), required: false}
        decision_rule: run only with a PI approval recorded in decisions
        decided_by: PI
        rationale: fit_protocol 0.6; phaseforge-plus-gradient-only

  - id: s6_package
    name: Packaging and reproducibility (no orphan TDBs)
    rationale: fit_protocol 14; Y32 (ORCHID_COORDINATION.md 30 Oct); full-reproducibility
    steps:
      - id: tdb_header
        name: Write the TDB header block
        kind: deterministic
        text: >-
          Prepend a comment block to the released TDB: protocol id@version (specific and general), run id of the pick, code
          commits, environment lock hash or container digest, sha256 of every input (unary source TDB, ORCHID evidence
          commit and evidence digest, MLIP weights), objective and weights, gates passed, and the reproduce command. The
          body below the header stays byte-identical to the pick TDB; record both hashes.
        supply: [final_pick.final_tdb]
        tool: {name: tdb_header.py, command: 'python3 protocols/tools/tdb_header.py protocols/specific/<artifact>@<version>.yaml release/<artifact>.tdb --code-commit <orchid-sage commit> --release <ORCHID release tag>', code: protocol_tools, environment: stdlib_tools}
        result:
          - {id: released_tdb, name: release/<artifact>.tdb, checks: [body sha256 = pick sha256]}
        rationale: Y32 TDB header rule
      - id: specific_protocol
        name: Write the specific protocol and the run cards
        kind: deterministic
        text: >-
          Write specific/<artifact>@<version>.yaml (instantiates this protocol; every override, the evidence selection with
          the evidence digest, the run sequence with failed attempts kept, decisions with dates and quotes, the artifact
          sha256, the acceptance target) and one run card per run (run_cards/), converted from the campaign's own run cards
          (never recomputed). Pin hashes with tools/pin_hashes.py and validate with tools/validate.py.
        supply: [final_pick.final_tdb, final_pick.step_summary, record_trajectory.trajectory]
        tool: {name: backfill_run_cards.py + validate.py, command: 'python3 tools/backfill_run_cards.py && python3 tools/pin_hashes.py specific/<file>.yaml && python3 tools/validate.py', code: protocol_tools, environment: stdlib_tools}
        result:
          - {id: specific, name: specific/<artifact>@<version>.yaml + run_cards/*.json, checks: [validator passes]}
        gates: [G6_no_orphan, G7_inputs_hashed]
        rationale: Y32 specific protocol
      - id: dashboard
        name: Build the assessment dashboard (REQUIRED, frozen snapshot of the pick)
        kind: deterministic
        text: >-
          Extract the assessment-results document (dashboard data) from the campaign files with the system's extractor
          (no recomputation; anything not on disk is shown as pending), validate it, and render the standalone HTML with
          tools/build_dashboard.py in frozen-snapshot mode: pick diagram with the fitted data, step sequence and per-step
          table, assemblage agreement map, invariant scorecard with ORCHID ids, objective components, per-dataset residuals,
          one-shot energies moved in sigma, physics checks, trajectory timeline and model-space projection, UQ, decisions,
          next actions and ORCHID intake, provenance with sha256. No external network.
        supply: [final_pick.final_tdb, final_pick.step_summary, record_trajectory.trajectory, physics_checks.physics, per_dataset.residuals, evaluate_states.states_evaluated, classify_draws.uq_summary, specific_protocol.specific]
        tool: {name: extract_dashboard_data.py + build_dashboard.py, command: 'python3 tools/extract_dashboard_data.py <system> dashboards/<artifact>/dashboard_data.json && python3 tools/build_dashboard.py dashboards/<artifact>/dashboard_data.json dashboards/<artifact>/dashboard.html --snapshot', code: protocol_tools, environment: stdlib_tools}
        result:
          - {id: dashboard, name: dashboards/<artifact>/dashboard.html + dashboard_data.json, checks: [validates against assessment-results.schema.json, renders offline, readable at 360 px width], required: true}
        gates: [G8_dashboard_present]
        rationale: PI 6 Nov ("should also be something delivered in each assessment"); fit_protocol 14 Required HTML campaign report
      - id: crate
        name: Build the Workflow Run RO-Crate
        kind: deterministic
        text: >-
          Build crates/<artifact>/ with tools/build_crate.py: ro-crate-metadata.json (RO-Crate 1.1, Workflow Run Crate and
          Process Run Crate profiles; the specific protocol as the main workflow, its HowToSteps, one CreateAction per run
          card with object = inputs and result = outputs, restricted inputs as hash-only contextual entities), the protocol
          rendered as HTML and Markdown, the dashboard, the run cards and the artifact.
        supply: [specific_protocol.specific, dashboard.dashboard]
        tool: {name: build_crate.py, command: 'python3 tools/build_crate.py specific/<artifact>@<version>.yaml crates/<artifact>', code: protocol_tools, environment: stdlib_tools}
        result:
          - {id: crate, name: crates/<artifact>/ro-crate-metadata.json + preview, checks: [every hasPart file exists with its sha256; no restricted file inside]}
        rationale: Y32 standards
      - id: independent_rerun
        name: Independent rerun on another machine
        kind: numerical
        text: >-
          Re-execute the specific protocol on a different machine (Studio vs MacBook vs Spark) from the hashed inputs, compare
          deterministic outputs byte for byte and numerical outputs against the tolerances, and attach the comparison report.
          A protocol counts only after this passes; no calculated observation and no TDB enters a release without it.
        supply: [crate.crate]
        tool: {name: orchid_reproduce.py, command: 'python3 protocols/tools/orchid_reproduce.py protocols/specific/<artifact>@<version>.yaml --root <fresh dir on another machine> --python <interpreter matching the lock> --pfp <PhaseForgePlus src at c66656f> --nproc 4 --report reproduce/<artifact>/comparison.json', code: protocol_tools, environment: stdlib_tools}
        result:
          - {id: rerun_report, name: reproduce/<artifact>/comparison.json}
        tolerances:
          - {quantity: invariant temperatures of the reproduced diagram, rule: absolute, value: 2, unit: K}
          - {quantity: stable phase sequence on heating at each composition of a 0.01 grid, rule: categorical_identical}
        gates: [G9_independent_rerun]
        rationale: Y32 addendum (PI 30 Oct "the name of the game is full reproducibility")
      - id: orchid_intake
        name: Prepare the ORCHID contribution package
        kind: deterministic
        text: >-
          Export every new or derived item (extractions, interpretations, campaign-added exclusions, computed observations
          with produced_by) to the ORCHID intake with provisional ids and review status; distinguish prepared, delivered,
          merged and released. Nothing is published without the PI's go.
        supply: [evidence_ledger.ledger, crate.crate]
        tool: {name: prepare_intake.py, command: 'python3 protocols/tools/prepare_intake.py assessments/<artifact>   # writes assessments/<artifact>/intake/ (prepared, not delivered)', code: protocol_tools, environment: stdlib_tools}
        result:
          - {id: intake, name: contribution_manifest.json + export ledger, checks: [every new item accounted for]}
        rationale: fit_protocol 4, 14

gates:
  - {id: G1_software_build, kind: gate, text: 'espei.__version__ printed from the fitting interpreter equals 0.8.11.dev82+g9039ea215 in every run card'}
  - {id: G2_pure_elements, kind: gate, text: 'pure-element limits: SGTE phase sequence and melting points reproduced; ordered end-members equal their disordered parent; a violation fails the artefact (unary-limits-fixed)'}
  - {id: G3_data_consistency_run, kind: gate, text: 'results/data_consistency.json exists for every dataset that enters the objective (flags only; the gate is that the check ran)'}
  - {id: G4_exclusions_present, kind: gate, text: 'every observed state has excluded phases (a hinge cell) or a listed reason why not (fit_protocol item 8: a dataset without them is incomplete)'}
  - {id: G5_trajectory_recorded, kind: gate, text: 'every start of every fit step has a trajectory record (PI 6 Nov); back-filled campaigns are labelled "trajectory not recorded"'}
  - {id: G6_no_orphan, kind: gate, text: 'the TDB ships with its specific protocol, run cards and evidence subset (Y32)'}
  - {id: G7_inputs_hashed, kind: gate, text: 'every input and output that exists on disk is referenced with its sha256 and the hashes match (validate.py)'}
  - {id: G8_dashboard_present, kind: gate, text: 'the frozen dashboard of the pick is in the package and validates (PI 6 Nov)'}
  - {id: G9_independent_rerun, kind: gate, text: 'an independent rerun on another machine is within the tolerances (Y32; required before release, not before fitting)'}

ranking_criteria:
  - {id: R1_plausible_energies, kind: ranking, text: 'filter first: compounds within ~10 kJ/mol-atom of the one-shot/MLIP values; thermochemistry within roughly its uncertainty; no physically odd entropies; pure elements equal SGTE. A fit that buys topology with implausible energies does not win. State the thresholds before ranking.', threshold: 10, unit: kJ/mol-atom}
  - {id: R2_topology, kind: ranking, text: 'among plausible fits: right reaction types, right fields, no spurious phases; severity of a spurious phase by temperature (practical T worse than above boiling; artefacts above the gas-stability limit may be irrelevant)'}
  - {id: R3_quantitative, kind: ranking, text: 'invariant temperatures (within 25 K of the observed values), then thermochemical RMSE by dataset; in-sample and held-out separately where a hold-out exists', threshold: 25, unit: K}

outputs:
  - {id: final_tdb, name: final pick TDB (with header for release), kind: tdb, lands: ORCHID next branch as an ORCHID-produced TDB, required: true}
  - {id: specific_protocol, name: specific protocol + run cards + evidence subset, kind: protocol, lands: with the TDB (produced_by), required: true}
  - {id: dashboard, name: frozen assessment dashboard (HTML + data), kind: dashboard, lands: with the TDB and in the crate, required: true}
  - {id: crate, name: Workflow Run RO-Crate, kind: ro_crate, lands: Zenodo with the release (PI go), required: true}
  - {id: intake, name: ORCHID contribution package, kind: orchid_intake, lands: orchid-data-next contributions/, required: true}

tolerances:
  - {quantity: 'deterministic outputs (datasets, hinge files, TDB from given parameters, run-card conversions, dashboard data)', rule: byte_identical}
  - {quantity: MLIP energies (GPU), rule: absolute, value: 0.1, unit: kJ/mol-atom, note: per cell and stage; same image and weights}
  - {quantity: 'optimiser result (same build, CPU, single thread)', rule: absolute, value: 0.01, unit: log-units, note: log posterior of the pick}
  - {quantity: fitted parameters, rule: absolute, value: null, note: 'fit_protocol 10b - absolute per parameter from the observed spread (Cr-Ni 50 J/mol and 0.03 J/mol/K; Cu-Zr 0.05 kJ/mol and 0.03 J/mol/K); never relative'}
  - {quantity: invariant temperatures of the final diagram, rule: absolute, value: 2, unit: K}
  - {quantity: phase sequence on heating over the declared T range at a 0.01 composition grid, rule: categorical_identical}

compute:
  mlip: DGX Spark spark1 (GPU; spark2, spark3 approved; never spark4 production); Vision only with the PI's go (paid)
  fits: Mac Studio CPU or spark1 CPU with the identical build; cap workers by load; OMP_NUM_THREADS=1 per start
  typical_wall: one-shot 2-5 h GPU per potential (solids) + 4-11 h (liquid, 864-atom critical path); fit steps 0.5-1.5 h each; Laplace ~0.5 h
  stop_rule: above ~12 h projected for any block, stop for a decision

limitations:
  - The fit steps are implemented as campaign scripts (reference_fit_code), not a packaged tool; a system needs its own copies (system names, VV layout, topology definitions).
  - The container image digest of the MLIP steps is not yet recorded; GPU MLIP results are reproducible only within the declared tolerances.
  - The optimiser is deterministic only for a fixed build, thread count and hardware; across machines the tolerance rule applies.
  - Topology classification uses campaign-specific checks (Cu-Zr judge.py T1-T5, Cr-Ni pd4.topology); pd-graph certification is not yet part of the protocol.
  - The liquid entropy correction (pair/quasi-chemical chemical term) is provisional until a human check and the authors' review.
  - The ZPF driving-force scale is ESPEI's default (1000 J/mol); converting each record's sigma_T is under test on Cr-Ni (6 Nov).
  - The ZPF energy scale of the 6 Nov picks is still ESPEI's default; the certainty tiers apply from the reruns on.

