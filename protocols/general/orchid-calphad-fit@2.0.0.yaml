# General protocol (Y32 level 1): MLIP-started, liquidus-first CALPHAD fit of a binary system.
# Executable recipe. The rationale is the prose protocol <orchid-sage>/docs/fit_protocol.md (cited per step as
# "fit_protocol <section>"); where the two seem to disagree, the prose governs and the conflict is listed in
# protocols/OPEN_QUESTIONS.md (never resolved silently here).
type: general_protocol
schema_version: orchid-assessment-schema@1.0.0-draft.2
id: orchid-calphad-fit
version: 2.0.0
title: ORCHID CALPHAD fit from a PhaseForge one-shot, liquid down (binary systems)
status: draft
status_note: >-
  Encodes fit_protocol.md v2.1 (6 Nov 2026: 2.0 plus the 6 Nov rulings, incl. certainty tiers per excluded phase (item 8), the converged-start pick rule (10a) with polish_starts, absolute tolerances (10b), the temperature-gated convexity constraint (0.4b) and the hinge floor (item 8, bef0bae)) (sha256 pinned in rationale_document), including the
  6 Nov PI decisions (midpoint rule, held never means fixed, exclusions at every observed state, Braga-type one-sided
  liquidus points). Draft until the PI approves it and one independent rerun of a specific protocol has passed (Y32).
purpose: >-
  Build a binary CALPHAD database (TDB) that someone else, a person or a machine, can regenerate from its inputs: a frozen
  PhaseForge one-shot from MLIP energetics, then a staged fit with gradient ESPEI that starts at the liquid and works down
  (liquidus, thermochemistry, solid state, ambiguous structures), with every observation weighted by its own uncertainty,
  fits ranked topology first among those with plausible energies, cheap uncertainty by a Laplace mixture, and a package
  (TDB with header, specific protocol, run cards, evidence subset, dashboard, RO-Crate) that leaves no orphan TDB.
licence: CC-BY-4.0
created: '2026-11-06'
maintainers:
  - {name: Raymundo Arróyave, role: PI, email: rarroyave@tamu.edu}
  - {name: Claude (ORCHID agent), role: maintainer}
rationale_document:
  path: <orchid-sage>/docs/fit_protocol.md
  sha256: d85b4dd42d4bf4fbfd342f386bbb6673fc3bb19a25989a665362aafc9fd66074
  storage_class: local
  role: rationale (prose protocol v2.1; sections 0.0a-0.6 and 1-15)
supersedes:
  - path: <home>/projects/orchid-review-analysis-20261026/automated-assessment/protocol/orchid-automated-assessment.protocol.json
    sha256: 1345f9d032117f029ea79e44a77482a4661b5e8e4c0d0213e7dea7eb2ef9fc6d
    relation: absorbs orchid-automated-assessment@0.1.0 (30 Oct; basinhopping default, held-out regions, pd-graph) where still in force
    storage_class: local
standards:
  steps: schema.org HowTo (HowToSection -> HowToStep with name, text, supply, tool, result)
  packaging: Workflow Run RO-Crate (https://w3id.org/ro/wfrun/workflow/0.5) and Process Run Crate (https://w3id.org/ro/wfrun/process/0.5)
  provenance: W3C PROV-O terms via the RO-Crate mapping (SCHEMA.md)
  executable_steps: CWL out of scope for now (maybe later, for the deterministic steps)

inputs:
  - id: orchid_evidence
    name: ORCHID evidence (literature records and the ESPEI bundle) at a pinned commit or release
    kind: orchid_evidence
    required_hashes: [git commit of orchid-data-next or Zenodo DOI, sha256 of every dataset file the objective reads]
    storage_class: local
  - id: unaries
    name: SGTE unary data for every pure-element end-member (the TDB's own SGTE functions)
    kind: unary_tdb
    required_hashes: [sha256 of the TDB the unaries are copied from]
    storage_class: public
  - id: mlip_weights
    name: GRACE-2L-SMAX-OMAT-large (value) and GRACE-2L-OMAT (cross-check) model files
    kind: mlip_weights
    required_hashes: ['sha256 of every model file (saved_model.pb, variables, metadata)']
    storage_class: public
  - id: structures
    name: compound structures (ORCHID phase registry and cited crystallography; fit_protocol 5)
    kind: structure_set
    required_hashes: [sha256 of every POSCAR]
    storage_class: local
  - id: sigma_mlip
    name: sigma_MLIP, the MLIP-vs-experiment energy uncertainty (dft-error-vs-experiment)
    kind: calibration
    required_hashes: [sha256 of the calibration file]
    storage_class: local
    note: the campaigns of 5-6 Nov use 9.687 kJ/mol-atom from <home>/projects/orchid-phaseforge-demo/results/sigma_mlip.json (see OPEN_QUESTIONS Q08)
  - id: restricted_sources
    name: publisher PDFs and private ORCHID exports read for new evidence
    kind: restricted_source
    required_hashes: [sha256 of every file]
    storage_class: restricted
    note: referenced by path and sha256 only; never copied into a package or quoted beyond 500 characters

