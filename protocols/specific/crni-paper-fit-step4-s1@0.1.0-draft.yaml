# Specific protocol (Y32 level 2) for ONE artifact: the Cr-Ni TDB picked on 6 Nov 2026 (step 4, start s1), the worked
# example of the unified ORCHID + PhaseForge + PhaseForge+ Cr-Ni paper. Back-filled from the campaign files (read only).
type: specific_protocol
schema_version: orchid-assessment-schema@1.0.0-draft.2
id: crni-paper-fit-step4-s1
version: 0.1.0-draft
title: Cr-Ni liquidus-first fit from the PhaseForge one-shot to the step-4 pick s1 (CrNi_paper_fit_FINAL_step4_s1.tdb)
status: draft
status_note: >-
  DRAFT. Reproduces the CURRENT Cr-Ni pick tdb/CrNi_paper_fit_FINAL_step4_s1.tdb. A ZPF-sigma test rerun of step 4
  (step4T1_excl, step4T2_excl_zpfsigma, step4T2a_zpfsigma_samehinge, step4T3_excl_relax: exclusions completed at every
  observed state, ZPF driving-force sigma from each record's sigma_T) is IN PROGRESS in the same directory; this document
  will be versioned when it finishes and the PI decides which step 4 is the pick.
system: CR-NI
purpose: >-
  Rebuild the Cr-Ni TDB tdb/CrNi_paper_fit_FINAL_step4_s1.tdb from its inputs: the PhaseForge one-shot (128-atom m_scraps SQS
  over the whole range, staged relaxation with GRACE-2L-SMAX-OMAT-large, 100 ps liquid MD at 1900 and 2200 K with the
  corrected Hong-Liu entropy), set E Cr-Ni data with ORCHID-rule sigmas, two ORCHID records (eutectic ORC-SV7H3CNRYS, CrNi2
  ordering ORC-X3KVP7D3PO), labelled BCC_A2 exclusions, and the sequence step 2 -> 3b -> 4 with gradient ESPEI on the Studio,
  followed by the physics checks and the Laplace-mixture UQ.
licence: CC-BY-4.0
created: '2026-11-06'
maintainers:
  - {name: Raymundo Arróyave, role: PI, email: rarroyave@tamu.edu}
  - {name: Claude (ORCHID agent), role: maintainer}
