acceptance_target:
  text: >-
    Reproduced when (1) the deterministic files (data/<group>/, data/hinge/step4_hinge.json, step-1 TDB, configs) are
    byte-identical to the hashes in the run cards; (2) rerunning step 4 from the step-3b pick with the same build on the Studio
    returns the main mode with logpost within 0.01 of -6332.2437 and every parameter within 50 J/mol (a-terms) and
    0.03 J/mol/K (b-terms) (fit_protocol 10b; or the pick TDB byte-identical, sha256 d46bf5dd...); (3) the reproduced diagram over 600-2200 K has the same phase sequence on heating at
    every x of a 0.01 grid, eutectic within 2 K of 1620 K and CrNi2 top within 2 K of 780 K (pd4 grid, 2 K steps); (4) pure
    elements exact (excess terms < 0.1 J at the end points); (5) the Laplace mixture weights within 0.01 and P(accepted
    topology) within 0.03 with new draws.
  tolerances:
    - {quantity: logpost of the main mode, rule: absolute, value: 0.01, unit: log-units}
    - {quantity: fitted a-terms of the pick (J/mol), rule: absolute, value: 50, unit: J/mol, note: 'fit_protocol 10b; observed cross-machine spread 17 J/mol'}
    - {quantity: fitted b-terms of the pick, rule: absolute, value: 0.03, unit: J/mol/K, note: 'fit_protocol 10b'}
    - {quantity: eutectic and CrNi2 top temperatures, rule: absolute, value: 2, unit: K}
    - {quantity: phase sequence on heating 600-2200 K on a 0.01 grid, rule: categorical_identical}
    - {quantity: Laplace mixture weight of the main mode, rule: absolute, value: 0.01}
    - {quantity: P(accepted topology) from 1000 new draws, rule: absolute, value: 0.03}
  reference_values:
    logpost: -6332.243665831225
    T_eutectic_K: 1620
    T_CrNi2_top_K: 780
    mixture_weights: {A_main_s1_perturbed: 0.901, B_s2_perturbed: 0.099}
    P_ok_strict: 0.201
    P_ok_apart_from_CrNi2_window: 0.596
    source: results/step_summary.json, steps/step4_solid/evaluation.json, results/uq/classified_mixture_draws.json, REPORT.md

