overrides:
  - {parameter: certainty_tiers, value: 'ZPF energy scale = ESPEI default 1000 J/mol for every ZPF row; hinge exclusions at option C (confidence 0.5, sigma 1000) or campaign sigma', general_default: 'certainty tiers 10 / 50 / 100 J/mol-atom per state (evidence/states.json gives the tier each state would have); observed states at confidence 1.0', reason: 'the tier rule (fit_protocol item 8, 6 Nov) postdates the fit; the reruns apply it', source: 'fit_protocol item 8; coordinator 6 Nov', conforms: false}
  - {parameter: phases, value: 'LIQUID, BCC_A2, FCC_A1 (disordered), CRNI2 stoichiometric 1:2 (Pt2Mo type) on SGTE fcc references; no FCC_L12; no magnetic terms', general_default: disordered unless evidence requires ordering, reason: PI decision 6 Nov (FCC_A1 only); CrNi2 is a known ordered compound, source: crni-phaseforge-20261105 PLAN.md "PI decision (6 Nov) - disordered fcc only", conforms: true}
  - {parameter: liquid temperatures, value: '2200 K (primary) and 1900 K (secondary); 864-atom check at x_Ni 0.5, 2200 K', general_default: one T just above the highest melting point, reason: 1900 K tests the temperature dependence; pure Cr crystallised at 1900 K after 82 ps and is analysed over 80 ps, source: crni-phaseforge-20261105 PLAN.md, conforms: true}
  - {parameter: prior, value: 'weak Normal prior centred at the one-shot (sd 50 kJ/mol on a-terms, 30 J/mol/K on b-terms)', general_default: none stated, reason: kept so that the Laplace step has a proper posterior (the rebuild's prior form), source: PLAN.md multistart section; scripts/model.py, conforms: true}
  - {parameter: step-2 free set, value: '12 symbols (liquid, bcc, fcc a,b); CRNI2 a,b NOT free in step 2', general_default: every phase free (held = anchored), reason: planned before the 6 Nov rule; step 3a showed fixing CrNi2 breaks the topology; step 3b and 4 free it, source: steps/configs/step2_liquidus.json; PLAN.md run log, conforms: false}
  - {parameter: step-4 exclusions, value: 'data/hinge/step4_hinge.json: set E 290 cells (CRNI2 added at T >= 895 K) + 17 Pugliese gamma states + 11 Curie marks, option C', general_default: excluded phases at EVERY observed state, reason: the completion to every state (build_hinge_complete.py) came after the step-4 fit and is being tested in step4T1/T3, source: scripts/build_hinge.py; scripts/build_hinge_complete.py, conforms: false}
  - {parameter: observed-absence weighting, value: 'BCC_A2 exclusions at the 17 Pugliese gamma states and 11 Curie marks entered by option C (confidence 0.5, sigma 1000)', general_default: 'confidence 1.0; sigma 10 J/mol-atom where certain (bcc in the Ni-rich fcc field is the PI example)', reason: 'the rule was added after the step-4 fit (item 8, 6 Nov 07:27)', source: fit_protocol item 8; scripts/build_hinge.py, conforms: false}
  - {parameter: step-2 pick, value: s7_perturbed (converged best start of the single mode), general_default: ranker pick, reason: 'the mechanical ranker chose s2 on a 1-temperature grid difference (12 vs 13 off-sequence temperatures) although s2 had not converged (|g| 0.011)', source: PLAN.md run log, conforms: true}
  - {parameter: accepted topology, value: 'stated in PLAN.md before ranking (bcc | bcc+CrNi2 | CrNi2 | CrNi2+fcc | fcc below T_CrNi2 in 800-930 K; eutectic 1560-1680 K; no same-phase gap; no spurious field)', general_default: R2, reason: stated before ranking, source: PLAN.md, conforms: true}
  - {parameter: plausibility thresholds, value: 'one-shot solid/compound within 10 kJ/mol-atom; |S_ex(0.5)| <= 2.5 J/mol-atom/K for bcc/fcc; liquid S_ex within 3u; thermochemistry RMSE by dataset within ~2 sigma; pure elements = SGTE', general_default: R1, reason: stated before ranking, source: PLAN.md, conforms: true}
  - {parameter: liquid entropy estimator, value: 'corrected Hong-Liu chemical term from <home>/ScientificRuns/hongliu-chemical-mixing-20261105/hongliu_mixing.py + the campaign VACF estimator (pre-PR scripts)', general_default: 'MLIPentropy (PhaseForge PR #11, a08ff3e)', reason: 'the Cr-Ni liquid analysis (5-6 Nov) predates the packaged MLIPentropy; the Cu-Zr validation of MLIPentropy 9e8140b against the same estimator agreed within 0.1 J/mol-atom/K', source: 'crni-phaseforge-20261105 PLAN.md "Reused from Cu-Zr"; cuzr-protocol-oneshot PLAN.md Run 2 item 2', conforms: true}
