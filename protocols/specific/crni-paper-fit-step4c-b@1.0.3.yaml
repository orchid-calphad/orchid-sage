acceptance_target:
  text: >-
    Reproduced when (1) the deterministic files (data/<group>/, data/hinge/step4c_hinge_floor.json, configs) are byte-identical to the
    hashes in the step-4c-b run card; (2) rerunning step 4c-b from the step-3b pick with the same build gives a 10a pick (named by the rule - eligible
    starts, then the objective - never by its start label) with logpost within 0.01 of -5657.2886, eligible under 10a (smooth or
    kink-stationary), judged by its predictions (PI 6 Nov 2026, "this is too strict"); its parameters are compared with 50 J/mol (a-terms) and
    0.03 J/mol/K (b-terms) (fit_protocol 10b) and reported as a note, the flat directions of the basin (where the recorded minima A_s4
    and A2_s5_flat differ by more than these tolerances) as undetermined; start and mode labels, cache files, timestamps and environment
    details that do not change a prediction are notes, never failures; byte checks only for data identity (staged inputs, evidence bundle,
    evaluated states); (2b) 10c from
    the rerun's 10a pick (seed 7201, 1500 evaluations per method) finds no point more than 0.01 above it; (3) the reproduced diagram over 600-2200 K has the
    same phase sequence on heating at every x of a 0.01 grid, eutectic within 2 K of 1614 K and CrNi2 top within 2 K of
    860 K (pd4 grid, 2 K steps); (4) pure elements exact; (4b) thermochemistry at the 10a pick: every data/thermo dataset with rms residual/sigma within 0.1 of the recorded pick; (5) the Laplace mixture weight of the main mode within 0.01 and
    P(accepted topology) within 0.03 with new draws.
  tolerances:
    - {quantity: logpost of the s4 start, rule: absolute, value: 0.01, unit: log-units}
    - {quantity: best logpost of each 10c run, rule: absolute, value: 0.01, unit: log-units, note: 'no better optimum beyond the tolerance'}
    - {quantity: fitted a-terms of the pick (J/mol), rule: absolute, value: 50, unit: J/mol, note: 'fit_protocol 10b; reported as a note, not in the verdict (PI 6 Nov); flat directions undetermined'}
    - {quantity: fitted b-terms of the pick, rule: absolute, value: 0.03, unit: J/mol/K, note: 'fit_protocol 10b; reported as a note, not in the verdict (PI 6 Nov); flat directions undetermined'}
    - {quantity: eutectic and CrNi2 top temperatures, rule: absolute, value: 2, unit: K}
    - {quantity: phase sequence on heating 600-2200 K on a 0.01 grid, rule: categorical_identical}
    - {quantity: 'thermochemistry: rms residual/sigma of each data/thermo dataset at the 10a pick', rule: absolute, value: 0.1, note: 'a tenth of each dataset''s own uncertainty (agent choice, labelled; 1.0.0 spark1 rerun: |delta z| <= 0.022)'}
    - {quantity: Laplace mixture weight of the main mode, rule: absolute, value: 0.01}
    - {quantity: P(accepted topology) from 1000 new draws, rule: absolute, value: 0.03}
  reference_values:
    logpost: -5657.288636859774
    grad_norm_q: 4.5368712701211385e-05
    T_eutectic_K: 1614
    T_CrNi2_top_K: 860
    mixture_weights: {A_s4: 0.7661, A2_s5_flat: 0.2339}
    P_ok_strict: 0.989
    P_CrNi2_within_25K_of_863: 0.871
    source: steps/step4c_b_hingefloor/evaluation.json, multistart.json, results/uq/laplace_step4c_b.json, results/uq/classified_mixture_draws_step4c_b.json

