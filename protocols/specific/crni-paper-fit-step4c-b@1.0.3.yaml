decision_requests:
  - id: DR-convergence-nonsmooth
    step: polish_starts
    question: 'Every step-3b start (8 of 8 on spark1, and on the Studio) stalls under polish_starts with the verified gradient at |g| 0.07-1.34; at the s0 endpoint the logpost decreases on BOTH sides of the gradient direction, linearly in the step over four decades - a kink of the ESPEI activity term (equilibrium-based chemical potentials: the derivative jumps where the stable assemblage at an activity point changes). A gradient-norm threshold cannot be met at such a point. How should convergence be judged for these objectives (e.g. a non-smooth stationarity test such as the minimum-norm element of sampled gradients in a small ball, or one-sided directional derivatives all <= 0), and does the step-4 artifact need to change? (carried from 0.1.0-draft: step 4c-b starts from the same step-3b pick; step 4c-b itself meets 10a in 8 of 8 starts) Not decided by the agent; the 10a threshold is not loosened.'
    evidence: [{path: protocols/reproduce/crni-step3b-polish-spark1/polish_report.json, sha256: 0d5b1ea2708cdf370021c3da55e946f38da674a8fe17c48d3b3cd471a7b358f8, storage_class: local}, {path: protocols/reproduce/crni-step3b-polish-spark1/diagnostics/gradient_diagnostics.json, sha256: e9f63054a5e8d125863abfd107f32abdc5188c62ebcc97d6e4738212a98f372e, storage_class: local}]
    blocks: [pick_thermo]
    status: decided
    decision_id: PI-2026-11-06-kink-rule
