changelog:
  - {version: 1.0.3, date: '2026-11-07', who: 'agent (document; coordinator brief of 7 Nov after the Q40 investigation)', change: 'code pins of the reproduce plan only: addendum-1.0.3 (model3.py, fit3.py, laplace3.py, run_global_crni2.py, check10a_ms2.py; MANIFEST.json) staged after the frozen snapshot and addenda; items step4c_b, check10a, global_10c and laplace_weights call the new versions. model3: the no-CRNI2 database of zpf_susp built with Database.from_string of the same text instead of a shared cache file, and GradTarget raises DataLossError when a category loses a record (ZPF records, fixed-configuration points, activity datasets) or a database lacks a phase; check10a_ms2: |re-evaluation - multistart file| > 1e-6 is a failure of the check (exit 3, no pick), each row records the record counts. No change to data, evidence pins, objective, starts, seeds, settings, tolerances or the artifact', bump: patch, why: 'instantiates orchid-calphad-fit@2.1.2 (modes by parameters, mode_tolerances = the 10b tolerances; reproduces the recorded modes_step4c_b.json). Q40: in the 1.0.2 rerun one 10a worker read the cache file truncated, its objective lacked the 12 zpf_susp records (-139.608 log-units at s1), s1 was classed not_stationary and the pick moved to s2; the same exposure exists in fit2 and the parallel 10c runs'}
  - {version: 1.0.2, date: '2026-11-07', who: 'agent (document; coordinator brief of 7 Nov, tier mismatch report)', change: 'evidence pins only: bundle MANIFEST@1.1.0.json (bundle_sha256 e5a035a379c50a2d81081cf0f6ce187340b321c651da872640d9f3a4efc60483), states@1.1.0.json and states_evaluated@1.1.0.json, built by build_evidence_bundle.py after two fixes: (1) each ZPF vertex converted to x(NI) (183 of 496 vertices are given in x(CR); 130 of 329 ZPF states moved), an unknown vertex stays null; (2) exclusion tiers copied from the hinge file the fit read (step4c_hinge_floor.json cells[].orchid.tiers; 673 / 186 / 19 over the 878 penalised pairs, as in results/step4c_build.json) instead of re-derived (526 / 343 / 9). evaluate_states item re-pinned (424 of 695 states match, was 404); the stage manifest is MANIFEST@1.1.0.json (its other 393 files - data, hinge, one-shot, model-input, artifact and reference files - are byte-identical to those of 1.0.0); dashboard crni-paper-fit-step4c-b-1.0.2 (the 1.0.0 dashboard with the states blocks of bundle 1.1.0). No change to data, objective, starts, seeds, settings or the artifact', bump: patch, why: 'states@1.0.0 evaluated 130 Cr-basis ZPF states at x(NI) = x(CR) and carried tiers the fit did not use; the fit read the data and hinge files directly and is unaffected (hinge_sigma_used = fit sigma for 878 of 878 pairs)'}
  - {version: 1.0.1, date: '2026-11-06', who: 'agent (document; coordinator brief of 6 Nov after the 1.0.0 spark1 rerun)', change: 'plan defects only: (1) check10a judged by the 10a pick named by the rule (eligible starts, then objective; scripts/pick10a.py) - objective, eligibility, eutectic and CrNi2 top judged; the 10b parameter comparison (flat directions undetermined) and TDB text reported as notes; thermochemistry added as a plan item (thermo_compare.py); verdict by predictions only, environment and PhaseForge+ checks as notes (PI 6 Nov, orchid_reproduce.py); global_10c starts from that pick; the step4c_b items s4-label checks moved to it; phase_sequence and pure_elements use the 10a pick TDB; (2) physics.py 1.0.1 reads the staged Cahn input (evidence model_inputs/cr-ni-coherent/results.json), addendum-1.0.1 snapshot; (3) PhaseForge+ pin = 10 source files (environment/pins/spark1_phaseforgeplus_src_files.sha256, code entry phaseforgeplus file source_pin); (4) instantiates orchid-calphad-fit@2.1.0 (rationale re-pinned to fit_protocol.md f42412e; 8b not applied to Cr-Ni); (5) 10c reproduced under the new general step global_search. No change to data, objective, starts, seeds, settings or the artifact', bump: patch, why: 'the 1.0.0 spark1 rerun reproduced the predictions but the tool verdict failed on plan defects (protocols/reproduce/crni-paper-fit-step4c-b-1.0.0-spark1/README.md)'}
  - {version: 1.0.0, date: '2026-11-06', who: 'agent (document; PI rules 10a kink rule 6b8f443 and 10c 420de17)', change: 'step 3b and step 4c-b re-checked under 10a with the kink rule on the Studio and spark1; 10c global search (basin hopping, dual annealing) from the 10a pick; pick unchanged; run cards for both; code addendum snapshot; reproduce plan gains the 10a and 10c items; DR-convergence-nonsmooth decided by the kink rule; stage fix: tdb/step1_oneshot.tdb (reference grid of pd4.py, read by fit2.py) copied from the step4-s1 bundle - missing from the 0.2.0-draft stage, found by the first 1.0.0 rerun attempt', bump: major, why: 'freeze of the final pick for the paper (brief of 6 Nov evening)'}
  - {version: 0.2.0-draft, date: '2026-11-06', who: 'PI (decision); agent (document)', change: 'step-4 pick = step4c_b_hingefloor s4 (was step4_solid s1); new run cards, evidence bundle crni-paper-fit-step4c-b@1.0.0, code snapshot, dashboard; overrides updated to the item-8 rules now applied', bump: minor, why: 'PI 6 Nov: hinge floor adopted after the step-4c test (0 of 8 starts stationary without it, 8 of 8 with it; CrNi2 860 K vs 863 K)'}
