# Specific protocol (Y32 level 2) for ONE artifact: the Cr-Ni TDB picked as step 4 on 6 Nov 2026 by the PI (step4c-b, start s4,
# hinge floor), the worked example of the unified ORCHID + PhaseForge + PhaseForge+ Cr-Ni paper. Version 1.0.3 changes ONLY the code
# pins of the reproduce plan (Q40 fix): model3.py (no-CRNI2 database of the zpf_susp category built in memory instead of through a
# shared cache file; fail-closed record check), fit3.py, laplace3.py, run_global_crni2.py and check10a_ms2.py (a re-evaluation that
# differs from the multistart value by more than 1e-6 fails the check). Objective bit-identical to model2 when no race occurs. Same
# data, evidence pins, objective, starts, seeds, settings and artifact as 1.0.2, which is kept unchanged (as are 1.0.0 and 1.0.1).
type: specific_protocol
schema_version: orchid-assessment-schema@1.0.0-draft.2
id: crni-paper-fit-step4c-b
version: 1.0.3
title: Cr-Ni liquidus-first fit from the PhaseForge one-shot to the step-4 pick step4c-b s4 (hinge floor; 10a kink rule; 10c global search; step4c_b_hingefloor_pick.tdb; reproduce plan fixed; evaluated states corrected; objective build race fixed)
status: draft
status_note: >-
  1.0.3 (7 Nov 2026), DRAFT until the PI approves. 1.0.2 (approved 7 Nov, kept unchanged) with new code versions in the reproduce
  plan only, fixing Q40 (protocols/reproduce/crni-paper-fit-step4c-b-1.0.2-spark1/q40/README.md): model2.no_crni2_tdb rewrote the
  shared file data/cache/step3b_thermo_crni2free_pick_noCRNI2.tdb (truncate, then write) while spawned workers read it, and an
  empty read silently dropped the 12 zpf_susp records from that worker's objective. model3.py builds that database in memory and
  GradTarget fails closed on any lost record; check10a_ms2.py fails the check (exit 3, no pick) when a re-evaluation differs from
  the multistart value by more than 1e-6; fit3.py, laplace3.py and run_global_crni2.py import model3. The objective, value and
  gradient are bit-identical to model2 at all 8 endpoints on the Studio and on spark1 (fix_proof in the 1.0.3 rerun directory). Data,
  evidence pins (bundle 1.1.0), starts, seeds, settings, tolerances and the artifact are those of 1.0.2. It instantiates
  orchid-calphad-fit@2.1.2 (1.0.2: 2.1.0), whose UQ step modes separates modes by parameters in units of the 10b tolerances, as
  this fit's recorded modes A_s4 and A2_s5_flat were in fact separated (decision row of 7 Nov). The dashboard is that of 1.0.2 (no prediction changes).
  Reproduces the Cr-Ni pick tdb/step4c_b_hingefloor_pick.tdb (unchanged from 0.2.0-draft).
system: CR-NI
purpose: >-
  Rebuild the Cr-Ni TDB tdb/step4c_b_hingefloor_pick.tdb from its inputs: the PhaseForge one-shot (128-atom m_scraps SQS over the whole
  range, staged relaxation with GRACE-2L-SMAX-OMAT-large and the relaxation midpoint rule for the anchors, 100 ps liquid MD at 1900 and
  2200 K with the corrected Hong-Liu entropy), set E Cr-Ni data with ORCHID-rule sigmas, two ORCHID records (eutectic ORC-SV7H3CNRYS,
  CrNi2 ordering ORC-X3KVP7D3PO), excluded phases at every observed state with per-phase certainty tiers, per-record ZPF scales sigma_DF
  floored at the tier, the hinge floor sigma = max(tier, converted state uncertainty), the smooth hinge onset, 17 kinetically limited
  CrNi2 absences suspended, and the sequence step 2 -> 3b -> 4c-b with gradient ESPEI on the Studio, followed by the physics checks and
  the Laplace-mixture UQ.
licence: CC-BY-4.0
