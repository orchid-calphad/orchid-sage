# Specific protocol (Y32 level 2) for ONE artifact: the Cr-Ni TDB picked as step 4 on 6 Nov 2026 by the PI (step4c-b, start s4,
# hinge floor), the worked example of the unified ORCHID + PhaseForge + PhaseForge+ Cr-Ni paper. New version of the Cr-Ni specific
# protocol; crni-paper-fit-step4-s1@0.1.0-draft (step-4 pick s1) is kept unchanged. Back-filled from the campaign files (read only).
type: specific_protocol
schema_version: orchid-assessment-schema@1.0.0-draft.2
id: crni-paper-fit-step4c-b
version: 0.2.0-draft
title: Cr-Ni liquidus-first fit from the PhaseForge one-shot to the step-4 pick step4c-b s4 (hinge floor; step4c_b_hingefloor_pick.tdb)
status: draft
status_note: >-
  DRAFT. Reproduces the CURRENT Cr-Ni pick tdb/step4c_b_hingefloor_pick.tdb (PI decision 6 Nov 2026: step4c-b is the step-4 pick and
  the hinge floor is a protocol rule, fit_protocol item 8, bef0bae). Steps 1-3b are unchanged from crni-paper-fit-step4-s1@0.1.0-draft
  (same run cards, same files); step 4 is step4c_b_hingefloor. Draft until the PI approves it and an independent rerun has passed (Y32).
system: CR-NI
purpose: >-
  Rebuild the Cr-Ni TDB tdb/step4c_b_hingefloor_pick.tdb from its inputs: the PhaseForge one-shot (128-atom m_scraps SQS over the whole
  range, staged relaxation with GRACE-2L-SMAX-OMAT-large and the relaxation midpoint rule for the anchors, 100 ps liquid MD at 1900 and
  2200 K with the corrected Hong-Liu entropy), set E Cr-Ni data with ORCHID-rule sigmas, two ORCHID records (eutectic ORC-SV7H3CNRYS,
  CrNi2 ordering ORC-X3KVP7D3PO), excluded phases at every observed state with per-phase certainty tiers, per-record ZPF scales sigma_DF
  floored at the tier, the hinge floor sigma = max(tier, converted state uncertainty), the smooth hinge onset, 17 kinetically limited
  CrNi2 absences suspended, and the sequence step 2 -> 3b -> 4c-b with gradient ESPEI on the Studio, followed by the physics checks and
  the Laplace-mixture UQ.
