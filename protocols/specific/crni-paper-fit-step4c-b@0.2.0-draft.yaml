overrides:
  - {parameter: certainty_tiers, value: 'per excluded phase (tiers3: 10 / 50 / 100 J/mol-atom); ZPF records 100, 50 when replicated (Karmazin 550 C and Zhang at 100); observed states at confidence 1.0', general_default: certainty tiers per excluded phase (item 8), reason: applied as written, source: 'results/tiers3.json; fit_protocol item 8', conforms: true}
  - {parameter: hinge_sigma_floor, value: 'hinge sigma = max(tier, converted state uncertainty), converted at the step-4 s1 pick (build_hinge_observed.py; 868 of 878 scales raised)', general_default: 'max(tier, converted state uncertainty) at the previous accepted step', reason: 'the conversion was evaluated at the step-4 s1 pick (the then-current step-4 fit), not at the step-3b pick the fit started from', source: 'scripts/build_step4c_floor.py; results/hinge_observed_sigma.json', conforms: true}
  - {parameter: ZPF driving-force scale, value: 'per-record sigma_DF = sqrt((|dS| sigma_T)^2 + (G'''' sigma_x |dx|)^2), floored at the record tier', general_default: weights from uncertainties (item 8 per-record ZPF scale), reason: applied as written, source: results/zpf_sigma_conversion.json, conforms: true}
  - {parameter: hinge onset, value: 'smooth (softplus) onset of width sigma/5', general_default: smooth hinge (item 8), reason: applied as written, source: steps/configs/step4c_b_hingefloor.json hinge_smooth, conforms: true}
  - {parameter: kinetically limited absences, value: 'CRNI2 exclusions dropped at 17 short-anneal states below 900 K; 12 Jette/Karmazin rows below 900 K enter as metastable bcc+fcc with CRNI2 suspended (data/zpf_susp)', general_default: item 8 kinetically limited absences, reason: applied as written; recorded as a decision, source: 'steps/configs/step4c_b_hingefloor.json note; scripts/model2.py', conforms: true}
  - {parameter: phases, value: 'LIQUID, BCC_A2, FCC_A1 (disordered), CRNI2 stoichiometric 1:2 (Pt2Mo type) on SGTE fcc references; no FCC_L12; no magnetic terms', general_default: disordered unless evidence requires ordering, reason: PI decision 6 Nov (FCC_A1 only); CrNi2 is a known ordered compound, source: crni-phaseforge-20261105 PLAN.md "PI decision (6 Nov) - disordered fcc only", conforms: true}
  - {parameter: liquid temperatures, value: '2200 K (primary) and 1900 K (secondary); 864-atom check at x_Ni 0.5, 2200 K', general_default: one T just above the highest melting point, reason: 1900 K tests the temperature dependence; pure Cr crystallised at 1900 K after 82 ps and is analysed over 80 ps, source: crni-phaseforge-20261105 PLAN.md, conforms: true}
  - {parameter: prior, value: 'weak Normal prior centred at the one-shot (sd 50 kJ/mol on a-terms, 30 J/mol/K on b-terms)', general_default: none stated, reason: kept so that the Laplace step has a proper posterior (the rebuild's prior form), source: PLAN.md multistart section; scripts/model2.py, conforms: true}
  - {parameter: step-2 free set, value: '12 symbols (liquid, bcc, fcc a,b); CRNI2 a,b NOT free in step 2', general_default: every phase free (held = anchored), reason: planned before the 6 Nov rule; step 3a showed fixing CrNi2 breaks the topology; step 3b and 4c-b free it, source: steps/configs/step2_liquidus.json; PLAN.md run log, conforms: false}
  - {parameter: step-2 pick, value: s7_perturbed (converged best start of the single mode), general_default: ranker pick, reason: 'the mechanical ranker chose s2 on a 1-temperature grid difference although s2 had not converged (|g| 0.011)', source: PLAN.md run log, conforms: true}
  - {parameter: step-3b pick, value: 's1_perturbed (campaign ranker of 6 Nov)', general_default: 'fit_protocol 10a - converged starts only', reason: 'no step-3b start meets 10a (Q36, Q39, DR-convergence-nonsmooth of 0.1.0-draft); step 4c-b starts from this TDB', source: 'OPEN_QUESTIONS Q36, Q39', conforms: false}
  - {parameter: accepted topology, value: 'stated in PLAN.md before ranking (bcc | bcc+CrNi2 | CrNi2 | CrNi2+fcc | fcc below T_CrNi2 in 800-930 K; eutectic 1560-1680 K; no same-phase gap; no spurious field)', general_default: R2, reason: stated before ranking, source: PLAN.md, conforms: true}
  - {parameter: plausibility thresholds, value: 'one-shot solid/compound within 10 kJ/mol-atom; |S_ex(0.5)| <= 2.5 J/mol-atom/K for bcc/fcc; liquid S_ex within 3u; thermochemistry RMSE by dataset within ~2 sigma; pure elements = SGTE', general_default: R1, reason: stated before ranking, source: PLAN.md, conforms: true}
  - {parameter: liquid entropy estimator, value: 'corrected Hong-Liu chemical term (hongliu_mixing.py) + the campaign VACF estimator (pre-PR scripts)', general_default: 'MLIPentropy (PhaseForge PR #11, a08ff3e)', reason: 'the Cr-Ni liquid analysis (5-6 Nov) predates the packaged MLIPentropy; Cu-Zr validation agreed within 0.1 J/mol-atom/K', source: 'crni-phaseforge-20261105 PLAN.md; cuzr-protocol-oneshot PLAN.md Run 2 item 2', conforms: true}

