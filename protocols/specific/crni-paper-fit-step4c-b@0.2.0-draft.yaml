decision_requests:
  - id: DR-convergence-nonsmooth
    step: polish_starts
    question: 'Every step-3b start (8 of 8 on spark1, and on the Studio) stalls under polish_starts with the verified gradient at |g| 0.07-1.34; at the s0 endpoint the logpost decreases on BOTH sides of the gradient direction, linearly in the step over four decades - a kink of the ESPEI activity term (equilibrium-based chemical potentials: the derivative jumps where the stable assemblage at an activity point changes). A gradient-norm threshold cannot be met at such a point. How should convergence be judged for these objectives (e.g. a non-smooth stationarity test such as the minimum-norm element of sampled gradients in a small ball, or one-sided directional derivatives all <= 0), and does the step-4 artifact need to change? (carried from 0.1.0-draft: step 4c-b starts from the same step-3b pick; step 4c-b itself meets 10a in 8 of 8 starts) Not decided by the agent; the 10a threshold is not loosened.'
    evidence: [{path: protocols/reproduce/crni-step3b-polish-spark1/polish_report.json, sha256: 0d5b1ea2708cdf370021c3da55e946f38da674a8fe17c48d3b3cd471a7b358f8, storage_class: local}, {path: protocols/reproduce/crni-step3b-polish-spark1/diagnostics/gradient_diagnostics.json, sha256: e9f63054a5e8d125863abfd107f32abdc5188c62ebcc97d6e4738212a98f372e, storage_class: local}]
    blocks: [pick_thermo]
    status: open
decisions:
  - {date: '2026-11-05', who: PI, decision: SGTE references for every end-member including fcc Cr (7.3 kJ); no inflection detection, why: compatibility with existing databases, source: crni-phaseforge-20261105 PLAN.md "PI ruling on references (5 Nov)", applies_to: [build_oneshot_tdb]}
  - {date: '2026-11-05', who: PI, decision: ordered fcc cells computed for the record; then disordered FCC_A1 only (6 Nov), why: CrNi2 is the real ordered phase; no evidence for a partitioned L1_2, source: crni-phaseforge-20261105 PLAN.md, applies_to: [build_oneshot_tdb, staged_relax]}
  - {date: '2026-11-06', who: PI, decision: bcc and fcc SQS over the whole composition range, why: each RK fit extrapolated over half the range, source: 'crni-phaseforge-20261105 PLAN.md "Extension (PI decision, 6 Nov)"', applies_to: [gen_sqs, staged_relax]}
  - {date: '2026-11-06', who: PI, decision: '"held" never means fixed: CRNI2 free in step 3b and 4, anchored by its one-shot HM_FORM at sigma 9.7 kJ', why: step 3a with CRNI2 fixed left it stable above the liquidus, source: PLAN.md run log; fit_protocol 0.1, quote: held never means fixed, applies_to: [fit_thermo, fit_solid]}
  - {date: '2026-11-06', who: agent, decision: step-2 pick s7_perturbed instead of the ranker's s2_perturbed, why: s2 not converged (|g| 0.011); the ranker's choice rested on a 1-temperature grid difference, source: PLAN.md run log, applies_to: [pick_liquidus]}
  - {date: '2026-11-06', who: PI, decision: excess electronic entropy of the liquid taken as zero (assumption), why: metallic liquid, source: PLAN.md model section; memory hong-liu-entropy-correction, applies_to: [liquid_entropy]}
  - {date: '2026-11-06', who: PI, decision: single-reader records (Curie marks; CrNi2 at 863 K) may enter the fit labelled; a second reading before release, why: avoid blocking the fit, source: memory exclusions-required-held-free, applies_to: [build_datasets, exclusions_every_state]}
  - {date: '2026-11-06', who: PI, decision: test the ZPF driving-force sigma from each record's sigma_T on Cr-Ni only (one measured change), why: CrNi2 83 K miss attributed to the default 1000 J/mol scale, source: REPORT.md open decision 1; memory exclusions-required-held-free item 3, applies_to: [fit_solid]}
  - {date: '2026-11-06', who: agent (reported to the PI), decision: 'step-4 pick = s1_perturbed (main mode; logpost -6332.2437; 4 of 8 starts)', why: 'protocol 0.3 ranking of evaluate.py; the higher-objective modes were absent in the original run; under fit_protocol 10a the same mode is picked (5 eligible starts)', source: REPORT.md Pick; steps/step4_solid/evaluation.json, applies_to: [pick_solid, final_pick]}

  - {date: '2026-11-06', who: PI, decision: 'step-4 pick = step4c-b (step4c_b_hingefloor, start s4_perturbed); the hinge floor sigma = max(tier, converted state uncertainty) adopted as a protocol rule', why: '0 of 8 starts stationary without the floor (step4c), 8 of 8 with it, one mode, CrNi2 860 K vs 863 K observed', source: 'coordinator message 6 Nov 2026; fit_protocol item 8 (commit bef0bae)', applies_to: [classify_certainty, fit_solid, pick_solid, final_pick]}
  - {date: '2026-11-06', who: PI, decision: 'per-record ZPF scale sigma_DF floored at the tier, smooth hinge onset (sigma/5), kinetically limited absences (CrNi2 suspended at short-anneal states)', why: 'Cr-Ni test: one mode in 8 of 8 starts, phase-boundary misfit halved, thermochemistry unchanged', source: 'fit_protocol item 8 (commit b31a0ca)', applies_to: [fit_solid]}
  - {date: '2026-11-06', who: PI, decision: '10a accepts kink-stationary endpoints; central FD is not a gradient; failed equilibria are failures', why: 'local kinks are inevitable (data points on model phase boundaries)', source: 'fit_protocol 10a (orchid-sage 6b8f443)', quote: local kinks are inevitable, applies_to: [pick_solid, final_pick]}
  - {date: '2026-11-06', who: agent (labelled), decision: 'new specific protocol id crni-paper-fit-step4c-b (version 0.2.0-draft, supersedes crni-paper-fit-step4-s1@0.1.0-draft) rather than a 0.2.0 of the old id', why: 'a specific protocol names ONE artifact; the old id names the step-4 s1 TDB, which stays reproducible under its own document', source: this document, applies_to: [final_pick]}

limitations:
  - '10a applied as revised by the PI on 6 Nov (kink rule, 6b8f443): eligibility kind smooth for all 8 starts; the directional test is coordinate, +-gradient and 16 seeded random directions only (numpy default_rng(20261106)); "within its own uncertainty" read as |residual| <= sigma of the on-boundary data point (agent reading). An earlier agent check that used central FD as a corrected gradient (results/grad_verify_step4c_b_hingefloor.json) is superseded by this rule.'
  - 'Notes, not rejections (plausibility thresholds stated before ranking): fcc one-shot enthalpies moved +14.5 (x 0.25) and +11.4 kJ (x 0.5) (> 10 kJ) while fcc calorimetry is met; bcc S_ex(0.5) +2.96 J/mol-atom/K (> 2.5); liquid S_ex Cr75Ni25 2200 K at z -3.1 (> 3u).'
  - 'Strict topology flag false only for a BCC_A2 + LIQUID sliver at 2176 K (one grid temperature, above every stated window; severity high-T only); eutectic and CrNi2 window both met.'
  - 'Steps 2 and 3b did not meet the 10a rule (step 2 CRNI2 not free; step 3b no converged start, Q36/Q39); step 4c-b starts from the step-3b pick.'
  - 'The hinge-floor conversion was evaluated at the step-4 s1 pick, not at the step-3b start (recorded as an override, conforms).'
  - 'Liquid S_ex at 1900 vs 2200 K inconsistent with H_mix(T) (Cp_ex -16 vs +4.8 J/mol-atom/K, 6.5 sigma at x_Ni 0.25); read as sampling/reference error; no T^2 or T ln T term.'
  - 'Possible double counting - ORCHID eutectic vs Jenkins arrests; 6 duplicate row pairs in Jette kept.'
  - 'No independent rerun of step 4c-b yet.'
